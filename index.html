<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作汇报管理工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#3B82F6;--primary-light:#60A5FA;--primary-dark:#2563EB;--primary-50:#EFF6FF;--primary-100:#DBEAFE;--primary-200:#BFDBFE;
  --bg:#F8FAFC;--surface:#FFFFFF;--border:#E2E8F0;--border-light:#F1F5F9;
  --text:#1E293B;--text-secondary:#64748B;--text-muted:#94A3B8;--text-light:#CBD5E1;
  --success:#10B981;--success-bg:#ECFDF5;--warning:#F59E0B;--warning-bg:#FFFBEB;--danger:#EF4444;--danger-bg:#FEF2F2;--info:#6366F1;--info-bg:#EEF2FF;
  --radius:10px;--radius-sm:6px;--radius-lg:14px;--radius-xl:18px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);--shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);--shadow-md:0 4px 6px -1px rgba(15,23,42,.07),0 2px 4px -2px rgba(15,23,42,.05);--shadow-lg:0 10px 15px -3px rgba(15,23,42,.08),0 4px 6px -4px rgba(15,23,42,.04);--shadow-xl:0 20px 25px -5px rgba(15,23,42,.08),0 8px 10px -6px rgba(15,23,42,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}
.app{display:flex;flex-direction:column;height:100vh}

/* Topbar */
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:20px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;color:var(--text);white-space:nowrap}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;box-shadow:0 2px 6px rgba(59,130,246,.3)}
.logo-sub{font-size:11px;color:var(--text-muted);font-weight:400;margin-left:2px}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.search-box{position:relative;width:240px}
.search-box input{width:100%;height:34px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 12px 0 32px;font-size:13px;background:var(--bg);font-family:inherit;transition:all .15s}
.search-box input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);width:14px;height:14px}
.btn{height:34px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;font-family:inherit;white-space:nowrap}
.btn:hover{border-color:var(--text-muted);background:var(--bg)}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--bg);border-color:var(--border)}
.btn-danger{color:var(--danger);border-color:transparent;background:transparent}
.btn-danger:hover{background:var(--danger-bg);border-color:var(--danger)}
.btn-icon{width:34px;height:34px;padding:0;justify-content:center}

/* Layout */
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:margin-left .2s}
.sidebar.collapsed{margin-left:-220px}
.nav{padding:12px 10px;flex:1;overflow-y:auto}
.nav-section{margin-bottom:18px}
.nav-section-title{font-size:10px;font-weight:600;color:var(--text-muted);letter-spacing:.5px;text-transform:uppercase;padding:0 10px;margin-bottom:6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:500;color:var(--text-secondary);transition:all .12s;position:relative}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--primary-50);color:var(--primary-dark)}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--primary);border-radius:2px}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-item .count{margin-left:auto;font-size:11px;background:var(--primary-100);color:var(--primary-dark);padding:1px 7px;border-radius:10px;font-weight:600}
.nav-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-daily{background:var(--success)}.dot-weekly{background:var(--primary)}.dot-monthly{background:var(--info)}.dot-yearly{background:var(--warning)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-header{height:54px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0;background:var(--surface)}
.main-title{font-size:16px;font-weight:600}
.main-subtitle{font-size:12px;color:var(--text-muted)}
.main-body{flex:1;overflow-y:auto;padding:24px}

/* Views */
.view{display:none}
.view.active{display:block}

/* Stats cards */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;position:relative;overflow:hidden;transition:all .15s}
.stat-card:hover{border-color:var(--text-light);box-shadow:var(--shadow-md)}
.stat-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.stat-card-label{font-size:12px;color:var(--text-muted);font-weight:500}
.stat-card-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.stat-card-icon svg{width:18px;height:18px}
.stat-card-value{font-size:30px;font-weight:700;line-height:1.2}
.stat-card-trend{font-size:12px;color:var(--text-muted);margin-top:4px;display:flex;align-items:center;gap:4px}
.stat-card .spark{position:absolute;right:16px;bottom:14px;opacity:.25}

/* Dashboard panels */
.dashboard-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.panel-header{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
.panel-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel-title svg{width:16px;height:16px;color:var(--primary)}
.panel-body{padding:16px 20px}
.panel-footer{padding:10px 20px;border-top:1px solid var(--border-light);text-align:center}
.panel-footer a{font-size:12px;color:var(--primary);cursor:pointer;text-decoration:none}
.panel-footer a:hover{text-decoration:underline}

/* Calendar */
.calendar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.calendar-header{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
.calendar-nav{display:flex;align-items:center;gap:4px}
.calendar-nav .cal-btn{width:30px;height:30px;border:none;background:transparent;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:all .12s}
.calendar-nav .cal-btn:hover{background:var(--bg)}
.calendar-title{font-size:15px;font-weight:600}
.calendar-select{height:30px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 8px;font-size:13px;background:var(--surface);cursor:pointer;font-family:inherit}
.calendar-weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border-light)}
.calendar-weekday{text-align:center;padding:8px 0;font-size:12px;font-weight:600;color:var(--text-muted)}
.calendar-weekday.weekend{color:var(--danger)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.calendar-cell{min-height:96px;border-right:1px solid var(--border-light);border-bottom:1px solid var(--border-light);padding:4px;cursor:pointer;transition:background .1s;position:relative}
.calendar-cell:nth-child(7n){border-right:none}
.calendar-cell:hover{background:var(--primary-50)}
.calendar-cell.other-month{background:var(--bg);opacity:.5}
.calendar-cell.today{background:var(--primary-50)}
.calendar-cell.today .cal-day-num{background:var(--primary);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px}
.cal-day-num{font-size:13px;font-weight:500;color:var(--text);padding:2px 0;text-align:center}
.cal-day-num.weekend{color:var(--danger)}
.cal-events{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.cal-event{font-size:10px;padding:2px 5px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.4}
.cal-event.daily{background:var(--success-bg);color:var(--success)}
.cal-event.weekly{background:var(--primary-100);color:var(--primary-dark)}
.cal-event.monthly{background:var(--info-bg);color:var(--info)}
.cal-event.pending{background:var(--warning-bg);color:var(--warning)}
.cal-more{font-size:10px;color:var(--text-muted);padding:1px 5px;text-align:center}

/* List view */
.list-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.list-toolbar{padding:12px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filter-tabs{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:var(--radius-sm)}
.filter-tab{padding:5px 14px;border-radius:5px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text-secondary);transition:all .12s;border:none;background:transparent;font-family:inherit}
.filter-tab.active{background:var(--surface);color:var(--primary-dark);box-shadow:var(--shadow-sm)}
.filter-tab:hover:not(.active){color:var(--text)}
.list-count{font-size:12px;color:var(--text-muted);margin-left:auto}
.list-table{width:100%}
.list-row{display:grid;grid-template-columns:60px 1fr 80px 60px 80px 120px 100px 80px;border-bottom:1px solid var(--border-light);padding:12px 20px;align-items:center;gap:12px;transition:background .1s}
.list-row:hover{background:var(--bg)}
.list-row.list-header:hover{background:transparent}
.list-header{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;padding:10px 20px;background:var(--bg)}
.list-row .title-cell{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px;cursor:pointer;overflow:hidden}
.list-row .title-cell:hover{color:var(--primary)}
.list-row .title-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-daily{background:var(--success-bg);color:var(--success)}
.badge-weekly{background:var(--primary-100);color:var(--primary-dark)}
.badge-monthly{background:var(--info-bg);color:var(--info)}
.badge-yearly{background:var(--warning-bg);color:var(--warning)}
.badge-draft{background:var(--border-light);color:var(--text-secondary)}
.badge-submitted{background:var(--success-bg);color:var(--success)}
.badge-pending{background:var(--warning-bg);color:var(--warning)}

/* Editor */
.editor-toolbar{padding:14px 24px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface)}
.editor-body{padding:24px;overflow-y:auto;flex:1}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.form-label .required{color:var(--danger)}
.form-input,.form-select,.form-textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:14px;font-family:inherit;background:var(--surface);color:var(--text);transition:all .15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.form-textarea{resize:vertical;min-height:80px;line-height:1.6}
.form-hint{font-size:12px;color:var(--text-muted);margin-top:4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* Timeline */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--border)}
.timeline-item{position:relative;padding-bottom:20px}
.timeline-item:last-child{padding-bottom:0}
.timeline-dot{position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary-100)}
.timeline-dot.draft{background:var(--text-muted);box-shadow:0 0 0 2px var(--border)}
.timeline-dot.submitted{background:var(--success);box-shadow:0 0 0 2px var(--success-bg)}
.timeline-dot.pending{background:var(--warning);box-shadow:0 0 0 2px var(--warning-bg)}
.timeline-content{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px}
.timeline-content:hover{border-color:var(--text-light);box-shadow:var(--shadow-sm)}
.timeline-title{font-size:13px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px;cursor:pointer}
.timeline-title:hover{color:var(--primary)}
.timeline-date{font-size:11px;color:var(--text-muted)}
.timeline-excerpt{font-size:12px;color:var(--text-secondary);margin-top:4px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Templates */
.template-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:8px}
.template-card:hover{border-color:var(--primary);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.template-card-header{display:flex;align-items:center;justify-content:space-between}
.template-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.template-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.template-desc{font-size:12px;color:var(--text-muted);line-height:1.5}
.template-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-muted);margin-top:4px}
.template-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.template-delete{position:absolute;top:12px;right:12px;opacity:0;transition:opacity .15s}
.template-card{position:relative}
.template-card:hover .template-delete{opacity:1}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--radius-xl);box-shadow:var(--shadow-xl);width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;animation:slideIn .2s}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal.modal-lg{max-width:760px}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:17px;font-weight:600}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 24px;border-top:1px solid var(--border-light);display:flex;align-items:center;justify-content:flex-end;gap:8px}

/* Section editor */
.section-item{border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;position:relative;background:var(--bg)}
.section-item-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.section-item-header .form-input{flex:1}
.section-drag{cursor:grab;color:var(--text-muted);width:16px;display:flex;align-items:center}
.section-drag:active{cursor:grabbing}
.section-remove{color:var(--danger);cursor:pointer;padding:4px}

.section-preview{background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.section-preview-label{font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px}

/* Preview */
.preview-container{background:var(--bg);border-radius:var(--radius);padding:24px;border:1px solid var(--border)}
.preview-doc{background:#fff;max-width:680px;margin:0 auto;border-radius:var(--radius);padding:40px;box-shadow:var(--shadow-md);font-size:14px;line-height:1.8}
.preview-doc h1{font-size:22px;text-align:center;margin-bottom:6px;font-weight:700}
.preview-doc h2{font-size:16px;margin:20px 0 8px;font-weight:600;border-left:3px solid var(--primary);padding-left:10px}
.preview-doc .doc-meta{text-align:center;color:var(--text-muted);font-size:13px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:12px}
.preview-doc .doc-section{margin-bottom:16px}
.preview-doc .doc-section-title{font-weight:600;margin-bottom:4px;color:var(--text)}
.preview-doc .doc-section-content{color:var(--text-secondary);white-space:pre-wrap}
.preview-doc .doc-footer{margin-top:24px;border-top:1px solid var(--border);padding-top:12px;text-align:right;font-size:13px;color:var(--text-muted)}

/* Toast */
.toast-container{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;font-size:13px;animation:toastIn .2s;max-width:360px}
@keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.success{border-left:3px solid var(--success)}
.toast.error{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid var(--primary)}
.toast svg{width:18px;height:18px;flex-shrink:0}
.toast.success svg{color:var(--success)}
.toast.error svg{color:var(--danger)}
.toast.info svg{color:var(--primary)}

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text-muted)}
.empty-icon{width:64px;height:64px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.empty-icon svg{width:32px;height:32px}
.empty-title{font-size:15px;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
.empty-desc{font-size:13px;color:var(--text-muted);margin-bottom:16px}

/* Streak badge */
.streak-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:linear-gradient(135deg,#FEF3C7,#FDE68A);color:#92400E;font-size:12px;font-weight:600}
.streak-badge svg{width:14px;height:14px}

/* Chart bars */
.chart-bars{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:10px}
.chart-bar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart-bar{width:100%;max-width:36px;border-radius:4px 4px 0 0;transition:height .3s ease;cursor:pointer;position:relative;min-height:4px}
.chart-bar:hover{opacity:.85}
.chart-bar-label{font-size:11px;color:var(--text-muted)}

/* Recent list */
.recent-list{display:flex;flex-direction:column;gap:8px}
.recent-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:background .1s}
.recent-item:hover{background:var(--bg)}
.recent-item .ri-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.recent-item .ri-info{flex:1;min-width:0}
.recent-item .ri-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-item .ri-date{font-size:11px;color:var(--text-muted)}
.recent-item .ri-arrow{color:var(--text-light)}

/* Tab bar for detail */
.detail-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border-light);margin-bottom:16px}
.detail-tab{padding:8px 16px;font-size:13px;font-weight:500;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;transition:all .12s}
.detail-tab.active{color:var(--primary-dark);border-bottom-color:var(--primary)}

/* Quick actions */
.quick-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.quick-action{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s}
.quick-action:hover{border-color:var(--primary);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.quick-action-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.quick-action-info .qa-title{font-size:14px;font-weight:600}
.quick-action-info .qa-desc{font-size:12px;color:var(--text-muted)}
.quick-action .qa-arrow{margin-left:auto;color:var(--text-light)}

/* Template selector chips */
.template-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.template-chip{padding:6px 14px;border:1px solid var(--border);border-radius:20px;font-size:13px;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:6px}
.template-chip:hover{border-color:var(--primary)}
.template-chip.active{background:var(--primary-50);border-color:var(--primary);color:var(--primary-dark)}
.template-chip svg{width:14px;height:14px}

/* Status select in list */
.status-select{height:26px;border:1px solid var(--border);border-radius:5px;font-size:12px;padding:0 6px;background:var(--surface);cursor:pointer;font-family:inherit}

/* Recording state */
.recording-indicator{display:inline-flex;align-items:center;gap:6px;color:var(--danger);font-weight:600;font-size:13px}
.recording-indicator .rec-dot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:recPulse 1.2s infinite}
@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Meeting minutes specific */
.meeting-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:8px}
.meeting-card:hover{border-color:var(--primary);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.meeting-card-header{display:flex;align-items:center;justify-content:space-between}
.meeting-card-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.meeting-card-desc{font-size:12px;color:var(--text-muted);line-height:1.5}
.meeting-card-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-muted);margin-top:4px}
.meeting-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}

/* Audio player */
.audio-player{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.audio-player audio{flex:1;height:32px}
.audio-player .audio-info{font-size:12px;color:var(--text-muted);white-space:nowrap}
.audio-wave{display:flex;align-items:center;gap:2px;height:24px}
.audio-wave span{width:3px;background:var(--primary);border-radius:2px;animation:waveAnim 1.2s ease-in-out infinite}
@keyframes waveAnim{0%,100%{height:6px}50%{height:20px}}

/* Transcript area */
.transcript-area{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-height:120px;max-height:300px;overflow-y:auto;font-size:13px;line-height:1.8;white-space:pre-wrap;color:var(--text-secondary)}
.transcript-area.empty{display:flex;align-items:center;justify-content:center;color:var(--text-muted)}

/* Upload zone */
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius-lg);padding:40px 20px;text-align:center;cursor:pointer;transition:all .15s;background:var(--bg)}
.upload-zone:hover{border-color:var(--primary);background:var(--primary-50)}
.upload-zone.dragover{border-color:var(--primary);background:var(--primary-100)}

/* Backdrop sidebar toggle on mobile */
@media(max-width:768px){
  .sidebar{position:absolute;z-index:50;height:calc(100% - 56px)}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .dashboard-grid{grid-template-columns:1fr}
  .template-grid{grid-template-columns:1fr}
  .meeting-grid{grid-template-columns:1fr}
  .list-row{grid-template-columns:1fr 80px 80px 100px 80px}
  .list-row .col-hide-mobile{display:none}
  }
  @media print {
    body * { visibility: hidden !important }
    #printArea, #printArea * { visibility: visible !important }
    #printArea { position: absolute; left: 0; top: 0; width: 100%; background: #fff; padding: 40px; font-family: "Microsoft YaHei", "SimSun", sans-serif; color: #1a1a1a }
    #printArea h1 { font-size: 22px; border-bottom: 2px solid #333; padding-bottom: 8px; margin-bottom: 16px }
    #printArea h2 { font-size: 16px; margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #ddd }
    #printArea .print-meta { font-size: 13px; color: #666; margin-bottom: 20px }
    #printArea .print-section { margin-bottom: 16px }
    #printArea .print-section-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; color: #222 }
    #printArea .print-section-content { font-size: 14px; line-height: 1.7; white-space: pre-wrap; color: #333 }
    #printArea .print-footer { margin-top: 30px; font-size: 13px; color: #999; border-top: 1px solid #eee; padding-top: 10px }
  }
</style>
</head>
<body>
<div class="app">
  <!-- Topbar -->
  <div class="topbar">
    <div class="logo">
      <div class="logo-icon">📋</div>
      <span>工作汇报管理 <span class="logo-sub">v1.0</span></span>

    <div class="topbar-actions">

        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>

  <div class="layout">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="nav">
        <div class="nav-section">

          <div class="nav-item" data-view="calendar" onclick="switchView('calendar')">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>日历视图

          <div class="nav-item" data-view="timeline" onclick="switchView('timeline')">

            <span class="count" id="countMonthly">0</span>

          <div class="nav-item" data-view="yearly" onclick="switchView('yearly')">
            <span class="dot dot-yearly"></span>年报
            <span class="count" id="countYearly">0</span>
          </div>
          <div class="nav-item" data-view="all" onclick="switchView('all')">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>全部报告
          </div>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">会议纪要</div>
          <div class="nav-item" data-view="meetings" onclick="switchView('meetings')">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>会议纪要
            <span class="count" id="countMeetings">0</span>

          <div class="nav-item" onclick="openMeetingEditor()">

        <div class="nav-section">
          <div class="nav-section-title">AI 智能生成</div>

            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>生成周报
          </div>
          <div class="nav-item" onclick="openAutoGen('monthly')">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>生成月报
          </div>
          <div class="nav-item" onclick="openAutoGen('yearly')">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>生成年报
          </div>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">配置</div>
          <div class="nav-item" data-view="templates" onclick="switchView('templates')">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>模板管理
          </div>
          <div class="nav-item" data-view="settings" onclick="switchView('settings')">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>设置
          </div>
        </div>
      </div>
      <div style="padding:12px 16px;border-top:1px solid var(--border-light);font-size:11px;color:var(--text-muted);text-align:center">
        数据本地存储 · AI 需配置 API Key · 隐私安全
      </div>
    </div>

    <!-- Main -->
    <div class="main">
      <div class="main-header" id="mainHeader"></div>
      <div class="main-body" id="mainBody"></div>
    </div>
  </div>
</div>

<!-- Modal container -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script>
'use strict';

/* =========================================================================
   DATA LAYER
   ========================================================================= */
var STORAGE_KEYS = {
  reports: 'wr_reports',
  templates: 'wr_templates',
  settings: 'wr_settings',
  meetings: 'wr_meetings'
};

var DEFAULT_TEMPLATES = [
  {
    id: 'tpl_daily_001',
    name: '标准日报模板',
    type: 'daily',
    icon: '📝',
    description: '今日完成、明日计划、需协调事项',
    sections: [
      { title: '今日完成工作', hint: '列出今天已完成的主要工作项' },
      { title: '进行中工作', hint: '正在进行但尚未完成的工作' },
      { title: '明日工作计划', hint: '明天计划推进的主要事项' },
      { title: '需协调/风险', hint: '需要协调的资源或潜在风险' }
    ],
    isDefault: true
  },
  {
    id: 'tpl_weekly_001',
    name: '标准周报模板',
    type: 'weekly',
    icon: '📊',
    description: '本周总结、下周计划、问题与建议',
    sections: [
      { title: '本周工作总结', hint: '概括本周主要工作成果与进展' },
      { title: '关键指标数据', hint: '本周关键KPI、数据指标完成情况' },
      { title: '问题与分析', hint: '遇到的问题、原因分析及解决方案' },
      { title: '下周工作计划', hint: '下周重点推进事项及预期目标' },
      { title: '需支持事项', hint: '需要领导或跨部门协调支持的事项' }
    ],
    isDefault: true
  },
  {
    id: 'tpl_monthly_001',
    name: '标准月报模板',
    type: 'monthly',
    icon: '📈',
    description: '月度总结、目标达成、经验复盘',
    sections: [
      { title: '月度工作概述', hint: '本月工作总体情况概述' },
      { title: '重点事项完成情况', hint: '本月重点推进事项及完成情况' },
      { title: '目标达成分析', hint: '月度目标完成度、数据对比分析' },
      { title: '经验与不足', hint: '本月总结的经验和发现的不足' },
      { title: '下月工作规划', hint: '下月工作重点、目标与推进计划' }
    ],
    isDefault: true
  },
  {
    id: 'tpl_yearly_001',
    name: '标准年报模板',
    type: 'yearly',
    icon: '🏷️',
    description: '年度总结、核心成果、年度复盘与来年规划',
    sections: [
      { title: '年度工作概述', hint: '全年工作整体回顾与总体评价' },
      { title: '核心成果与里程碑', hint: '年度关键成果、重要里程碑事件' },
      { title: '各阶段工作回顾', hint: '按季度/阶段回顾主要工作推进情况' },
      { title: '数据与目标达成', hint: '年度目标完成度、核心数据指标对比' },
      { title: '经验教训与反思', hint: '全年总结的成功经验与不足反思' },
      { title: '来年工作规划', hint: '下一年的工作方向、目标与关键计划' }
    ],
    isDefault: true
  }
];

var DEFAULT_SETTINGS = {
  author: '',
  department: '',
  autoTimestamp: true,
  weekStart: 1, // 0=Sunday, 1=Monday
  remindDaily: 17, // 17:00
  remindWeekly: 17, // Friday 17:00
  remindMonthly: 10, // 10th of month
  // AI 模型配置（OpenAI 兼容接口）
  aiEnabled: true,
  aiApiUrl: 'https://api.deepseek.com/v1',
  aiApiKey: '', // 用户自行填入
  aiModel: 'deepseek-chat',
  // Whisper 语音转录配置（保留本地 Ollama 可选）
  whisperEnabled: false,
  whisperApiUrl: 'http://localhost:11434', // Ollama whisper endpoint
  whisperModel: 'whisper'
};

function loadData(key, fallback) {
  try {
    var raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch(e) {
    return fallback;
  }
}

function saveData(key, data) {
  try {
    localStorage.setItem(key, JSON.stringify(data));
    return true;
  } catch(e) {
    toast('数据保存失败：' + e.message, 'error');
    return false;
  }
}

var templates = loadData(STORAGE_KEYS.templates, DEFAULT_TEMPLATES);
var reports = loadData(STORAGE_KEYS.reports, []);
var meetings = loadData(STORAGE_KEYS.meetings, []);
var settings = loadData(STORAGE_KEYS.settings, DEFAULT_SETTINGS);

function persistReports() { saveData(STORAGE_KEYS.reports, reports); }
function persistTemplates() { saveData(STORAGE_KEYS.templates, templates); }
function persistSettings() { saveData(STORAGE_KEYS.settings, settings); }
function persistMeetings() { saveData(STORAGE_KEYS.meetings, meetings); }

/* =========================================================================
   UTILITY FUNCTIONS
   ========================================================================= */
function uid() {
  return 'r_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

function formatDate(d, fmt) {
  if (typeof d === 'string') d = new Date(d);
  if (!(d instanceof Date) || isNaN(d)) return '';
  var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
  fmt = fmt || 'YYYY-MM-DD';
  return fmt
    .replace('YYYY', d.getFullYear())
    .replace('MM', pad(d.getMonth() + 1))
    .replace('DD', pad(d.getDate()))
    .replace('HH', pad(d.getHours()))
    .replace('mm', pad(d.getMinutes()));
}

function parseDate(str) {
  if (str instanceof Date) return str;
  if (typeof str === 'string') {
    str = str.trim();
    // Support formats: YYYY-MM-DD, YYYY/MM/DD, YYYY.MM.DD, YYYY年MM月DD日, ISO timestamp, with optional HH:mm
    var parts = str.split(' ');
    var dateStr = parts[0];
    // Normalize separators to '-'
    var normalized = dateStr.replace(/[\/\.年月]/g, '-').replace(/日/g, '');
    var dateParts = normalized.split('-').map(Number);
    var timeParts = parts[1] ? parts[1].split(':').map(Number) : [0, 0];
    if (dateParts.length >= 3 && !isNaN(dateParts[0]) && !isNaN(dateParts[1]) && !isNaN(dateParts[2])) {
      return new Date(dateParts[0], dateParts[1] - 1, dateParts[2], timeParts[0] || 0, timeParts[1] || 0);
    }
    // Fallback: ISO timestamp (e.g. 2026-10-13T09:00:00.000Z)
    var d = new Date(str);
    if (!isNaN(d)) return d;
  }
  return new Date(str);
}

/* normalizeDate(str): converts various date formats to YYYY-MM-DD */
function normalizeDate(str) {
  if (!str) return '';
  str = String(str).trim();
  var m = str.match(/(\d{4})[\/\.\-年月](\d{1,2})[\/\.\-月](\d{1,2})日?/);
  if (m) {
    var mm = ('0' + m[2]).slice(-2);
    var dd = ('0' + m[3]).slice(-2);
    return m[1] + '-' + mm + '-' + dd;
  }
  return str;
}

function getWeekNumber(d) {
  d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function getWeekRange(d) {
  var date = new Date(d);
  var day = date.getDay();
  var diff = date.getDate() - day + (day === 0 ? -6 : 1); // Monday
  var monday = new Date(date.setDate(diff));
  var sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  return { start: monday, end: sunday };
}

function dateStr(d) {
  return formatDate(d, 'YYYY-MM-DD');
}

function daysBetween(d1, d2) {
  var diff = Math.abs(parseDate(d1) - parseDate(d2));
  return Math.floor(diff / 86400000);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, function(m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
}

function getTemplate(id) {
  return templates.find(function(t) { return t.id === id; });
}

function getTemplateByType(type) {
  return templates.find(function(t) { return t.type === type; }) || templates[0];
}

function getReport(id) {
  return reports.find(function(r) { return r.id === id; });
}

/* =========================================================================
   TOAST
   ========================================================================= */
function toast(msg, type) {
  type = type || 'info';
  var container = document.getElementById('toastContainer');
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  var icon = type === 'success'
    ? '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>'
    : type === 'error'
    ? '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>'
    : '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
  el.innerHTML = icon + '<span>' + escapeHtml(msg) + '</span>';
  container.appendChild(el);
  setTimeout(function() {
    el.style.opacity = '0';
    el.style.transform = 'translateX(100%)';
    el.style.transition = 'all .3s';
    setTimeout(function() { el.remove(); }, 300);
  }, 2800);
}

/* =========================================================================
   SIDEBAR
   ========================================================================= */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

/* =========================================================================
   VIEW SWITCHING
   ========================================================================= */
var currentView = 'dashboard';

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(function(el) {
    el.classList.toggle('active', el.dataset.view === view);
  });
  document.getElementById('searchInput').value = '';
  renderView(view);
}

function renderView(view) {
  var header = document.getElementById('mainHeader');
  var body = document.getElementById('mainBody');

  // Clear existing views
  body.innerHTML = '';

  switch(view) {
    case 'dashboard': renderDashboard(header, body); break;
    case 'calendar': renderCalendarView(header, body); break;
    case 'timeline': renderTimelineView(header, body); break;
    case 'daily':
    case 'weekly':
    case 'monthly':
    case 'yearly':
    case 'all': renderListView(view, header, body); break;
    case 'meetings': renderMeetingsView(header, body); break;
    case 'templates': renderTemplatesView(header, body); break;
    case 'settings': renderSettingsView(header, body); break;
  }
}

  var today = dateStr(new Date());
  var dailyReports = reports.filter(function(r) { return r.type === 'daily'; }).map(function(r) { return r.date; });
  var streak = 0;

/* =========================================================================
   CALENDAR VIEW
   ========================================================================= */
var calendarDate = new Date();

function renderCalendarView(header, body) {
  header.innerHTML = '<div class="main-title">日历视图</div><div class="main-subtitle">点击日期可快速创建报告</div>';

  var year = calendarDate.getFullYear();
  var month = calendarDate.getMonth();
  var monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

  var firstDay = new Date(year, month, 1);
  var lastDay = new Date(year, month + 1, 0);
  var startWeekday = firstDay.getDay();
  if (settings.weekStart === 1) {
    startWeekday = (startWeekday === 0) ? 6 : startWeekday - 1;
  }
  var daysInMonth = lastDay.getDate();
  var prevMonthLastDay = new Date(year, month, 0).getDate();

  var cells = [];
  // Previous month days
  for (var i = startWeekday - 1; i >= 0; i--) {
    cells.push({ day: prevMonthLastDay - i, otherMonth: true, date: new Date(year, month - 1, prevMonthLastDay - i) });
  }
  // Current month days
  for (var i = 1; i <= daysInMonth; i++) {
    cells.push({ day: i, date: new Date(year, month, i) });
  }
  // Next month days to fill grid
  var remaining = (7 - (cells.length % 7)) % 7;
  for (var i = 1; i <= remaining; i++) {
    cells.push({ day: i, otherMonth: true, date: new Date(year, month + 1, i) });
  }

  var weekdayLabels = settings.weekStart === 1
    ? ['周一','周二','周三','周四','周五','周六','周日']
    : ['周日','周一','周二','周三','周四','周五','周六'];

  body.innerHTML = `
    <div class="calendar">
      <div class="calendar-header">
        <div class="calendar-title">${year}年 ${monthNames[month]}</div>
        <div class="calendar-nav">
          <button class="cal-btn" onclick="calNav(-1)" title="上个月"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button class="cal-btn" onclick="calToday()" title="今天"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m7.08 7.08l4.24 4.24M1 12h6m6 0h6"/></svg></button>
          <button class="cal-btn" onclick="calNav(1)" title="下个月"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
      </div>
      <div class="calendar-weekdays">
        ${weekdayLabels.map(function(w, i) {
          var isWeekend = settings.weekStart === 1 ? (i >= 5) : (i === 0 || i === 6);
          return '<div class="calendar-weekday' + (isWeekend ? ' weekend' : '') + '">' + w + '</div>';
        }).join('')}
      </div>
      <div class="calendar-grid">
        ${cells.map(function(c) {
          var ds = dateStr(c.date);
          var dayReports = reports.filter(function(r) { return r.date === ds; });
          var isToday = ds === dateStr(new Date());
          var isWeekendDay = c.date.getDay() === 0 || c.date.getDay() === 6;
          return '<div class="calendar-cell' + (c.otherMonth ? ' other-month' : '') + (isToday ? ' today' : '') + '" onclick="onCalCellClick(\'' + ds + '\')">' +
            '<div class="cal-day-num' + (isWeekendDay && !c.otherMonth ? ' weekend' : '') + '">' + c.day + '</div>' +
            '<div class="cal-events">' + dayReports.slice(0, 3).map(function(r) {
              var cls = r.type;
              if (r.status === 'pending') cls = 'pending';
              return '<div class="cal-event ' + cls + '" onclick="event.stopPropagation();openDetail(\'' + r.id + '\')" title="' + escapeHtml(r.title) + '">' + escapeHtml(r.title) + '</div>';
            }).join('') + (dayReports.length > 3 ? '<div class="cal-more">+' + (dayReports.length - 3) + ' 更多</div>' : '') + '</div>' +
          '</div>';
        }).join('')}
      </div>
    </div>
  `;
}

function calNav(delta) {
  calendarDate.setMonth(calendarDate.getMonth() + delta);
  renderView('calendar');
}

function calToday() {
  calendarDate = new Date();
  renderView('calendar');
}

function onCalCellClick(ds) {
  // Check if there's already a report for this date
  var dayReports = reports.filter(function(r) { return r.date === ds; });
  if (dayReports.length === 0) {
    openEditor(null, 'daily', ds);
  } else {
    openDetail(dayReports[0].id);
  }
}

/* =========================================================================
   TIMELINE VIEW
   ========================================================================= */
function renderTimelineView(header, body) {
  header.innerHTML = '<div class="main-title">时间线</div><div class="main-subtitle">按时间倒序查看所有报告</div>';

  var sorted = reports.slice().sort(function(a, b) {
    return parseDate(b.date) - parseDate(a.date);
  });

  if (sorted.length === 0) {
    body.innerHTML = '<div class="empty"><div class="empty-icon"><svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div><div class="empty-title">暂无报告</div><div class="empty-desc">点击右上角"写日报"开始记录</div><button class="btn btn-primary" onclick="quickReport(\'daily\')">写日报</button></div>';
    return;
  }

  // Group by date
  var groups = {};
  sorted.forEach(function(r) {
    if (!groups[r.date]) groups[r.date] = [];
    groups[r.date].push(r);
  });

  var groupKeys = Object.keys(groups).sort(function(a, b) {
    return parseDate(b) - parseDate(a);
  });

  var dotClass = { draft: 'draft', submitted: 'submitted', pending: 'pending' };
  var typeBadge = { daily: 'badge-daily', weekly: 'badge-weekly', monthly: 'badge-monthly', yearly: 'badge-yearly' };
  var typeText = { daily: '日报', weekly: '周报', monthly: '月报', yearly: '年报' };

  body.innerHTML = '<div class="timeline" style="max-width:760px;margin:0 auto">' +
    groupKeys.map(function(date) {
      var items = groups[date];
      var d = parseDate(date);
      var dateLabel = formatDate(d, 'YYYY年MM月DD日');
      var weekdayLabels = ['周日','周一','周二','周三','周四','周五','周六'];
      return '<div class="timeline-item">' +
        '<div class="timeline-dot"></div>' +
        '<div style="font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:8px">' + dateLabel + ' ' + weekdayLabels[d.getDay()] + '</div>' +
        items.map(function(r) {
          var tpl = getTemplate(r.templateId) || { icon: '📄' };
          var excerpt = r.sections.map(function(s) { return s.content; }).filter(Boolean).join(' · ');
          if (excerpt.length > 100) excerpt = excerpt.substring(0, 100) + '…';
          return '<div class="timeline-content" style="margin-bottom:8px;cursor:pointer" onclick="openDetail(\'' + r.id + '\')">' +
            '<div class="timeline-title">' +
              '<span>' + (tpl.icon || '📄') + '</span>' +
              '<span>' + escapeHtml(r.title) + '</span>' +
              '<span class="badge ' + typeBadge[r.type] + '">' + typeText[r.type] + '</span>' +
            '</div>' +
            '<div class="timeline-date">' + getStatusText(r.status) + '</div>' +
            (excerpt ? '<div class="timeline-excerpt">' + escapeHtml(excerpt) + '</div>' : '') +
          '</div>';
        }).join('') +
      '</div>';
    }).join('') +
  '</div>';
}

function filterList(btn, status) {
  btn.parentNode.querySelectorAll('.filter-tab').forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');
  var rows = document.querySelectorAll('#listBody .list-row');
  var visible = 0;
  rows.forEach(function(row) {
    if (status === 'all' || row.dataset.status === status) {
      row.style.display = '';
      visible++;
    } else {
      row.style.display = 'none';
    }
  });
  document.getElementById('listCount').textContent = '共 ' + visible + ' 条';
}

function changeStatus(id, status) {
  var r = getReport(id);
  if (r) {
    r.status = status;
    r.updatedAt = new Date().toISOString();
    persistReports();
    toast('状态已更新为：' + getStatusText(status), 'success');
    // Update the row badge
    var row = document.getElementById('row_' + id);
    if (row) {
      row.dataset.status = status;
      var badge = row.querySelector('.badge-badge, [class*="badge-"]');
      // Re-render the list row badge
      var badges = row.querySelectorAll('.badge');
      badges.forEach(function(b) {
        if (b.className.indexOf('badge-draft') >= 0 || b.className.indexOf('badge-submitted') >= 0 || b.className.indexOf('badge-pending') >= 0) {
          b.className = 'badge badge-' + status;
          b.textContent = getStatusText(status);
        }
      });
    }
  }
}

function getStatusText(status) {
  return { draft: '草稿', submitted: '已提交', pending: '待提交' }[status] || status;
}

      ${templates.map(function(t) {

          '<div class="template-card-header">' +

              '<div class="template-icon" style="background:' + typeBg[t.type] + ';color:' + typeColors[t.type] + ';width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px">' + (t.icon || '📄') + '</div>' +
              '<span>' + escapeHtml(t.name) + '</span>' +

            '<span>' + (t.sections ? t.sections.length : 0) + ' 个板块</span>' +
          '</div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">' +

            }).join('') +
            (t.sections && t.sections.length > 4 ? '<span style="font-size:11px;padding:2px 8px;color:var(--text-muted)">+' + (t.sections.length - 4) + '</span>' : '') +

}

function filterTemplates(chip, type) {
  chip.parentNode.querySelectorAll('.template-chip').forEach(function(c) { c.classList.remove('active'); });
  chip.classList.add('active');
  document.querySelectorAll('#templateGrid .template-card').forEach(function(card) {
    if (type === 'all' || card.dataset.type === type) {
      card.style.display = '';
    } else {
      card.style.display = 'none';
    }
  });
}

function deleteTemplate(id) {
  var t = getTemplate(id);
  if (!t) return;
  if (t.isDefault) {
    toast('默认模板不可删除', 'error');
    return;
  }
  if (confirm('确定删除模板"' + t.name + '"？')) {
    templates = templates.filter(function(t) { return t.id !== id; });
    persistTemplates();
    toast('模板已删除', 'success');
    renderView('templates');
  }
}

/* =========================================================================
   TEMPLATE EDITOR
   ========================================================================= */
function openTemplateEditor(id) {
  var t = id ? getTemplate(id) : null;
  var isNew = !t;
  if (!t) {
    t = { id: '', name: '', type: 'daily', icon: '📝', description: '', sections: [{ title: '', hint: '' }] };
  }

  var modalBox = document.getElementById('modalBox');
  modalBox.className = 'modal modal-lg';
  modalBox.innerHTML = `
    <div class="modal-header">
      <div class="modal-title">${isNew ? '新建模板' : '编辑模板'}</div>
      <button class="btn btn-ghost btn-icon" onclick="closeModal()"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">模板名称 <span class="required">*</span></label>
          <input type="text" class="form-input" id="tplName" value="${escapeHtml(t.name)}" placeholder="如：标准日报模板">
        </div>
        <div class="form-group">
          <label class="form-label">报告类型 <span class="required">*</span></label>
          <select class="form-select" id="tplType">
            <option value="daily" ${t.type==='daily'?'selected':''}>日报</option>
            <option value="weekly" ${t.type==='weekly'?'selected':''}>周报</option>
            <option value="monthly" ${t.type==='monthly'?'selected':''}>月报</option>
            <option value="yearly" ${t.type==='yearly'?'selected':''}>年报</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">图标（Emoji）</label>
          <input type="text" class="form-input" id="tplIcon" value="${escapeHtml(t.icon||'📝')}" placeholder="📝" style="max-width:80px">
        </div>
        <div class="form-group">
          <label class="form-label">简短描述</label>
          <input type="text" class="form-input" id="tplDesc" value="${escapeHtml(t.description||'')}" placeholder="模板用途说明">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">模板板块 <span class="required">*</span> <span style="font-weight:400;color:var(--text-muted);font-size:12px">（每个板块对应报告中的一个内容区域）</span></label>
        <div id="sectionList">
          ${(t.sections||[]).map(function(s, i) {
            return renderSectionItem(s, i);
          }).join('')}
        </div>
        <button class="btn btn-sm" style="margin-top:8px" onclick="addSection()">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>添加板块
        </button>
      </div>
      <div class="form-group">
        <label class="form-label">预览</label>
        <div class="preview-container">
          <div class="preview-doc" id="tplPreview"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveTemplate(${isNew ? "''" : "'" + id + "'"})">保存模板</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
  updateTemplatePreview();
  // Bind input events for live preview
  ['tplName','tplType','tplIcon','tplDesc'].forEach(function(id2) {
    var el = document.getElementById(id2);
    if (el) el.addEventListener('input', updateTemplatePreview);
  });
}

function renderSectionItem(s, i) {
  return '<div class="section-item" data-index="' + i + '">' +
    '<div class="section-item-header">' +
      '<input class="form-input section-title-input" value="' + escapeHtml(s.title || '') + '" placeholder="板块标题（如：今日完成工作）" oninput="updateTemplatePreview()">' +
      '<button class="section-remove" onclick="removeSection(this)" title="删除"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>' +
    '</div>' +
    '<input class="form-input section-hint-input" value="' + escapeHtml(s.hint || '') + '" placeholder="板块提示语（可选，如：列出今日主要工作项）" oninput="updateTemplatePreview()" style="font-size:13px">' +
  '</div>';
}

function addSection() {
  var list = document.getElementById('sectionList');
  var idx = list.children.length;
  var div = document.createElement('div');
  div.innerHTML = renderSectionItem({ title: '', hint: '' }, idx);
  list.appendChild(div.firstChild);
  updateTemplatePreview();
}

function removeSection(btn) {
  btn.closest('.section-item').remove();
  updateTemplatePreview();
}

function updateTemplatePreview() {
  var name =document.getElementById('tplName').value || '模板名称';
  var type = document.getElementById('tplType').value;
  var icon = document.getElementById('tplIcon').value || '📄';
  var typeText = { daily: '日报', weekly: '周报', monthly: '月报', yearly: '年报' }[type];
  var sections = [];
  document.querySelectorAll('#sectionList .section-item').forEach(function(item) {
    sections.push({
      title: item.querySelector('.section-title-input').value,
      hint: item.querySelector('.section-hint-input').value
    });
  });

  var preview = document.getElementById('tplPreview');
  if (!preview) return;
  preview.innerHTML = '<h1>' + icon + ' ' + escapeHtml(name) + '</h1>' +
    '<div class="doc-meta">' + typeText + ' · ' + formatDate(new Date(), 'YYYY-MM-DD') + '</div>' +
    sections.filter(function(s) { return s.title; }).map(function(s) {
      return '<div class="doc-section"><div class="doc-section-title">' + escapeHtml(s.title) + '</div>' +
        '<div class="doc-section-content">' + (s.hint ? '【' + escapeHtml(s.hint) + '】' : '在此输入内容...') + '</div></div>';
    }).join('') +
    '<div class="doc-footer">汇报人：' + escapeHtml(settings.author || '您的姓名') + '</div>';
}

function saveTemplate(id) {
  var name = document.getElementById('tplName').value.trim();
  var type = document.getElementById('tplType').value;
  var icon = document.getElementById('tplIcon').value.trim() || '📄';
  var desc = document.getElementById('tplDesc').value.trim();
  var sections = [];
  document.querySelectorAll('#sectionList .section-item').forEach(function(item) {
    var title = item.querySelector('.section-title-input').value.trim();
    var hint = item.querySelector('.section-hint-input').value.trim();
    if (title) sections.push({ title: title, hint: hint });
  });

  if (!name) { toast('请填写模板名称', 'error'); return; }
  if (sections.length === 0) { toast('请至少添加一个板块', 'error'); return; }

  if (id) {
    var t = getTemplate(id);
    t.name = name; t.type = type; t.icon = icon; t.description = desc; t.sections = sections;
  } else {
    templates.push({ id: 'tpl_' + Date.now().toString(36), name: name, type: type, icon: icon, description: desc, sections: sections, isDefault: false });
  }
  persistTemplates();
  closeModal();
  toast('模板保存成功', 'success');
  renderView('templates');
}

/* =========================================================================
   REPORT EDITOR
   ========================================================================= */
var editingReportId = null;

function quickReport(type) {
  openEditor(null, type, dateStr(new Date()));
}

function openEditor(id, type, date) {
  editingReportId = id;
  var report = id ? getReport(id) : null;
  var tpl;

  if (report) {
    tpl = getTemplate(report.templateId) || getTemplateByType(report.type);
    type = report.type;
  } else {
    tpl = getTemplateByType(type);
  }

  var reportDate = report ? report.date : (date || dateStr(new Date()));
  var typeText = { daily: '日报', weekly: '周报', monthly: '月报', yearly: '年报' }[type];

  // Pre-fill title
  var defaultTitle = report ? report.title : '';
  if (!report) {
    if (type === 'daily') {
      defaultTitle = '日报 ' + formatDate(parseDate(reportDate), 'MM-DD');
    } else if (type === 'weekly') {
      var wr = getWeekRange(parseDate(reportDate));
      defaultTitle = '周报 ' + formatDate(wr.start, 'MM-DD') + '~' + formatDate(wr.end, 'MM-DD');
    } else if (type === 'monthly') {
      defaultTitle = '月报 ' + formatDate(parseDate(reportDate), 'YYYY年MM月');
    }
  }

  // Sections
  var sections = report ? report.sections : (tpl.sections || []).map(function(s) {
    return { title: s.title, hint: s.hint, content: '' };
  });

  var modalBox = document.getElementById('modalBox');
  modalBox.className = 'modal modal-lg';
  modalBox.innerHTML = `
    <div class="modal-header">
      <div class="modal-title">${report ? '编辑' : '新建'}${typeText}</div>
      <div style="display:flex;gap:8px;align-items:center">
        <select class="form-select" id="reportTemplate" style="width:auto;height:30px;font-size:12px" onchange="switchTemplate()">
          ${templates.filter(function(t){return t.type===type}).map(function(t){
            return '<option value="'+t.id+'"'+(t.id===tpl.id?' selected':'')+'>'+escapeHtml(t.icon+' '+t.name)+'</option>';
          }).join('')}
        </select>
        <button class="btn btn-ghost btn-icon" onclick="closeModal()"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group" style="grid-column:1">
          <label class="form-label">报告标题 <span class="required">*</span></label>
          <input type="text" class="form-input" id="reportTitle" value="${escapeHtml(defaultTitle)}" placeholder="输入报告标题">
        </div>
        <div class="form-group">
          <label class="form-label">日期</label>
          <input type="date" class="form-input" id="reportDate" value="${reportDate}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">状态</label>
          <select class="form-select" id="reportStatus">
            <option value="draft" ${report&&report.status==='draft'?'selected':''}>草稿</option>
            <option value="submitted" ${report&&report.status==='submitted'?'selected':''}>已提交</option>
            <option value="pending" ${report&&report.status==='pending'?'selected':''}>待提交</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">标签</label>
          <input type="text" class="form-input" id="reportTags" value="${report?escapeHtml((report.tags||[]).join(', ')):''}" placeholder="多个标签用逗号分隔">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">报告内容</label>
        <div id="reportSections">
          ${sections.map(function(s, i) {
            return renderReportSection(s, i);
          }).join('')}
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">预览</label>
        <div class="preview-container">
          <div class="preview-doc" id="reportPreview"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn" onclick="saveReport('draft')">存为草稿</button>
      <button class="btn btn-primary" onclick="saveReport('submit')">${report&&report.status==='submitted'?'更新并提交':'保存并提交'}</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
  updateReportPreview();
  // Bind live preview
  document.getElementById('reportTitle').addEventListener('input', updateReportPreview);
  document.getElementById('reportDate').addEventListener('input', updateReportPreview);
  document.querySelectorAll('#reportSections .section-content-input').forEach(function(el) {
    el.addEventListener('input', updateReportPreview);
  });
}

function renderReportSection(s, i) {
  return '<div class="section-item" data-index="' + i + '" data-section-title="' + escapeHtml(s.title) + '" style="background:var(--surface)">' +
    '<div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:6px">' +
      '<span style="width:20px;height:20px;border-radius:4px;background:var(--primary-50);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">' + (i+1) + '</span>' +
      escapeHtml(s.title) +
    '</div>' +
    (s.hint ? '<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">' + escapeHtml(s.hint) + '</div>' : '') +
    '<textarea class="form-textarea section-content-input" data-section="' + i + '" placeholder="在此输入内容..." style="min-height:70px">' + escapeHtml(s.content || '') + '</textarea>' +
  '</div>';
}

function switchTemplate() {
  var tplId = document.getElementById('reportTemplate').value;
  var tpl = getTemplate(tplId);
  if (!tpl) return;
  var report = editingReportId ? getReport(editingReportId) : null;
  // Keep existing content if same title, else reset
  var existingContent = {};
  var freeContent = '';
  if (report) {
    report.sections.forEach(function(s) {
      // Free-mode AI reports keep all content in a single "报告内容" section;
      // preserve it so switching templates does not lose the user's content.
      if (s.title === '报告内容' && (s.content || '').trim()) {
        freeContent = s.content;
      } else {
        existingContent[s.title] = s.content;
      }
    });
  }
  var sections = (tpl.sections || []).map(function(s, idx) {
    var content = existingContent[s.title] || '';
    // Move free-mode content into the first section as a starting point
    if (!content && idx === 0 && freeContent) content = freeContent;
    return { title: s.title, hint: s.hint, content: content };
  });
  if (freeContent) toast('已切换模板，原自由生成内容已移至第一个板块，请核对整理', 'info');
  document.getElementById('reportSections').innerHTML = sections.map(function(s, i) {
    return renderReportSection(s, i);
  }).join('');
  // Re-bind
  document.querySelectorAll('#reportSections .section-content-input').forEach(function(el) {
    el.addEventListener('input', updateReportPreview);
  });
  updateReportPreview();
}

function updateReportPreview() {
  var title = document.getElementById('reportTitle').value || '报告标题';
  var date = document.getElementById('reportDate').value;
  var tplId = document.getElementById('reportTemplate').value;
  var tpl = getTemplate(tplId);
  var sections = [];
  document.querySelectorAll('#reportSections .section-item').forEach(function(item) {
    var sectionTitle = item.getAttribute('data-section-title') || '';
    var content = item.querySelector('.section-content-input').value;
    sections.push({ title: sectionTitle, content: content });
  });

  var preview = document.getElementById('reportPreview');
  if (!preview) return;
  preview.innerHTML = '<h1>' + (tpl && tpl.icon ? tpl.icon + ' ' : '') + escapeHtml(title) + '</h1>' +
    '<div class="doc-meta">' + (date ? formatDate(parseDate(date), 'YYYY年MM月DD日') : '') + '</div>' +
    sections.filter(function(s) { return s.title; }).map(function(s) {
      return '<div class="doc-section"><div class="doc-section-title">' + escapeHtml(s.title) + '</div>' +
        '<div class="doc-section-content">' + (s.content ? escapeHtml(s.content).replace(/\n/g, '<br>') : '<span style="color:var(--text-muted)">（未填写）</span>') + '</div></div>';
    }).join('') +
    '<div class="doc-footer">汇报人：' + escapeHtml(settings.author || '您的姓名') + (settings.department ? ' · ' + escapeHtml(settings.department) : '') + '</div>';
}

function saveReport(action) {
  var title = document.getElementById('reportTitle').value.trim();
  var date = document.getElementById('reportDate').value;
  var status = action === 'submit' ? 'submitted' : document.getElementById('reportStatus').value;
  var tags = document.getElementById('reportTags').value.trim().split(/[,，、]/).filter(Boolean);
  var tplId = document.getElementById('reportTemplate').value;
  var tpl = getTemplate(tplId);

  if (!title) { toast('请填写报告标题', 'error'); return; }
  if (!date) { toast('请选择日期', 'error'); return; }

  var sections = [];
  var sectionItems = document.querySelectorAll('#reportSections .section-item');
  sectionItems.forEach(function(item) {
    var sectionTitle = item.getAttribute('data-section-title') || '';
    var content = item.querySelector('.section-content-input').value;
    sections.push({ title: sectionTitle, content: content });
  });

  if (editingReportId) {
    var r = getReport(editingReportId);
    r.title = title;
    r.date = date;
    r.status = status;
    r.tags = tags;
    r.templateId = tplId;
    r.sections = sections;
    r.updatedAt = new Date().toISOString();
  } else {
    reports.push({
      id: uid(),
      title: title,
      type: tpl ? tpl.type : 'daily',
      date: date,
      status: status,
      tags: tags,
      templateId: tplId,
      sections: sections,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    });
  }
  persistReports();
  closeModal();
  toast(action === 'submit' ? '报告已保存并标记为已提交' : '草稿已保存', 'success');
  renderView(currentView);
  updateCounts();
}

    <div class="modal-body">
      <div class="preview-container">

          <h1>${tpl.icon || '📄'} ${escapeHtml(r.title)}</h1>
          <div class="doc-meta">
            ${formatDate(parseDate(r.date), 'YYYY年MM月DD日')}${r.tags && r.tags.length ? ' · 标签：' + r.tags.map(function(t){return escapeHtml(t)}).join('、') : ''}
          </div>
          ${r.sections.filter(function(s){return s.title}).map(function(s){
            return '<div class="doc-section"><div class="doc-section-title">' + escapeHtml(s.title) + '</div>' +

          }).join('')}
          <div class="doc-footer">汇报人：${escapeHtml(settings.author || '您的姓名')}${settings.department ? ' · ' + escapeHtml(settings.department) : ''}</div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      ${r.status !== 'submitted' ? '<button class="btn btn-ghost" style="margin-right:auto;color:var(--success)" onclick="markSubmitted(\'' + r.id + '\')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>标记已提交</button>' : ''}
      <button class="btn" onclick="copyReportText('${r.id}')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制纯文本
      </button>
      <button class="btn" onclick="exportReportWord('${r.id}')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>导出Word
      </button>
      <button class="btn" onclick="exportReportPDF('${r.id}')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>导出PDF
      </button>

function markSubmitted(id) {
  var r = getReport(id);
  if (r) {
    r.status = 'submitted';
    r.updatedAt = new Date().toISOString();
    persistReports();
    closeModal();
    toast('已标记为已提交', 'success');
    renderView(currentView);
  }
}

function copyReportText(id) {
  var r = getReport(id);
  if (!r) return;
  var tpl = getTemplate(r.templateId);
  var text = (tpl && tpl.icon ? tpl.icon + ' ' : '') + r.title + '\n';
  text += formatDate(parseDate(r.date), 'YYYY年MM月DD日') + '\n\n';
  r.sections.forEach(function(s) {
    if (s.title) {
      text += '【' + s.title + '】\n';
      text += (s.content || '(未填写)') + '\n\n';
    }
  });
  text += '\n汇报人：' + (settings.author || '');
  if (settings.department) text += ' · ' + settings.department;

  // Copy to clipboard
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() {
      toast('已复制到剪贴板', 'success');
    }).catch(function() {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    toast('已复制到剪贴板', 'success');
  } catch(e) {
    toast('复制失败，请手动选择复制', 'error');
  }
  document.body.removeChild(ta);
}

function _buildReportHtml(r) {
  var tpl = getTemplate(r.templateId) || { icon: '📄' };
  var typeText = { daily: '日报', weekly: '周报', monthly: '月报', yearly: '年报' };
  var dateDisplay = formatDate(parseDate(r.date), 'YYYY年MM月DD日');
  var html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + escapeHtml(r.title) + '</title>' +
    '<style>body{font-family:"Microsoft YaHei","SimSun",sans-serif;color:#1a1a1a;max-width:700px;margin:0 auto;padding:40px 20px;line-height:1.7}' +
    'h1{font-size:22px;border-bottom:2px solid #333;padding-bottom:8px;margin-bottom:4px}' +
    '.meta{font-size:13px;color:#666;margin-bottom:20px}' +
    '.section{margin-bottom:16px}.section h2{font-size:16px;margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid #ddd;color:#222}' +
    '.section .content{font-size:14px;white-space:pre-wrap;color:#333}' +
    '.footer{margin-top:30px;font-size:13px;color:#999;border-top:1px solid #eee;padding-top:10px}</style></head><body>';
  html += '<h1>' + (tpl.icon || '📄') + ' ' + escapeHtml(r.title) + '</h1>';
  html += '<div class="meta">' + dateDisplay + (r.tags && r.tags.length ? ' · 标签：' + r.tags.map(function(t){return escapeHtml(t)}).join('、') : '') + ' · ' + typeText[r.type] + '</div>';
  r.sections.forEach(function(s) {
    if (s.title) {
      html += '<div class="section"><h2>' + escapeHtml(s.title) + '</h2><div class="content">' + escapeHtml(s.content || '（未填写）') + '</div></div>';
    }
  });
  html += '<div class="footer">汇报人：' + escapeHtml(settings.author || '您的姓名') + (settings.department ? ' · ' + escapeHtml(settings.department) : '') + '</div>';
  html += '</body></html>';
  return html;
}

function exportReportWord(id) {
  var r = getReport(id);
  if (!r) return;
  var html = _buildReportHtml(r);
  var blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = r.title + '_' + formatDate(parseDate(r.date), 'YYYYMMDD') + '.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Word 文件已导出', 'success');
}

function toggleExportMenu(btn) {
  var menu = btn.nextElementSibling;
  var isOpen = menu.style.display !== 'none';
  closeExportMenus();
  if (!isOpen) menu.style.display = 'block';
}

function closeExportMenus() {
  document.querySelectorAll('.export-menu').forEach(function(m) { m.style.display = 'none'; });
}

function exportAllReportsWord() {
  if (!reports.length) { toast('暂无报告可导出', 'warning'); return; }
  var typeText = { daily: '日报', weekly: '周报', monthly: '月报', yearly: '年报' };
  var html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>全部报告导出</title>' +
    '<style>body{font-family:"Microsoft YaHei","SimSun",sans-serif;color:#1a1a1a;max-width:700px;margin:0 auto;padding:40px 20px;line-height:1.7}' +
    'h1{font-size:20px;border-bottom:2px solid #333;padding-bottom:6px;margin-bottom:4px;margin-top:40px}h1:first-child{margin-top:0}' +
    '.meta{font-size:13px;color:#666;margin-bottom:16px}' +
    '.section{margin-bottom:12px}.section h2{font-size:15px;margin:0 0 4px;padding-bottom:3px;border-bottom:1px solid #ddd;color:#222}' +
    '.section .content{font-size:14px;white-space:pre-wrap;color:#333}' +
    '.footer{font-size:13px;color:#999;border-top:1px solid #eee;padding-top:8px;margin-top:16px}' +
    '.page-break{page-break-after:always;border:none;border-top:1px dashed #ccc;margin:30px 0}</style></head><body>';
  var sorted = reports.slice().sort(function(a, b) { return parseDate(b.date) - parseDate(a.date); });
  sorted.forEach(function(r, idx) {
    if (idx > 0) html += '<hr class="page-break">';
    var tpl = getTemplate(r.templateId) || { icon: '📄' };
    html += '<h1>' + (tpl.icon || '📄') + ' ' + escapeHtml(r.title) + '</h1>';
    html += '<div class="meta">' + formatDate(parseDate(r.date), 'YYYY年MM月DD日') + ' · ' + (typeText[r.type] || '报告') + '</div>';
    r.sections.forEach(function(s) {
      if (s.title) {
        html += '<div class="section"><h2>' + escapeHtml(s.title) + '</h2><div class="content">' + escapeHtml(s.content || '（未填写）') + '</div></div>';
      }
    });
    html += '<div class="footer">汇报人：' + escapeHtml(settings.author || '您的姓名') + (settings.department ? ' · ' + escapeHtml(settings.department) : '') + '</div>';
  });
  html += '</body></html>';
  var blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '全部报告_' + formatDate(new Date(), 'YYYYMMDD') + '.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('已导出 ' + reports.length + ' 篇报告（Word格式）', 'success');
}

function exportReportPDF(id) {
  var r = getReport(id);
  if (!r) return;
  var tpl = getTemplate(r.templateId) || { icon: '📄' };
  var typeText = { daily: '日报', weekly: '周报', monthly: '月报', yearly: '年报' };
  var dateDisplay = formatDate(parseDate(r.date), 'YYYY年MM月DD日');
  var printDiv = document.createElement('div');
  printDiv.id = 'printArea';
  var inner = '<h1>' + (tpl.icon || '📄') + ' ' + escapeHtml(r.title) + '</h1>';
  inner += '<div class="print-meta">' + dateDisplay + (r.tags && r.tags.length ? ' · 标签：' + r.tags.map(function(t){return escapeHtml(t)}).join('、') : '') + ' · ' + typeText[r.type] + '</div>';
  r.sections.forEach(function(s) {
    if (s.title) {
      inner += '<div class="print-section"><div class="print-section-title">' + escapeHtml(s.title) + '</div><div class="print-section-content">' + escapeHtml(s.content || '（未填写）') + '</div></div>';
    }
  });
  inner += '<div class="print-footer">汇报人：' + escapeHtml(settings.author || '您的姓名') + (settings.department ? ' · ' + escapeHtml(settings.department) : '') + '</div>';
  printDiv.innerHTML = inner;
  document.body.appendChild(printDiv);
  window.print();
  setTimeout(function() { document.body.removeChild(printDiv); }, 1000);
}

function duplicateReport(id) {
  var r = getReport(id);
  if (!r) return;
  var newReport = JSON.parse(JSON.stringify(r));
  newReport.id = uid();
  newReport.title = r.title + ' (副本)';
  newReport.status = 'draft';
  newReport.date = dateStr(new Date());
  newReport.createdAt = new Date().toISOString();
  newReport.updatedAt = new Date().toISOString();
  reports.push(newReport);
  persistReports();
  toast('报告已复制', 'success');
  renderView(currentView);
  updateCounts();
}

function deleteReport(id) {
  var r = getReport(id);
  if (!r) return;
  if (confirm('确定删除报告"' + r.title + '"？此操作不可恢复。')) {
    reports = reports.filter(function(r) { return r.id !== id; });
    persistReports();
    toast('报告已删除', 'success');
    renderView(currentView);
    updateCounts();
  }
}
