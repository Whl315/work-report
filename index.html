function doImport() {
  var fileInput = document.getElementById('importFile');
  var mode = document.getElementById('importMode').value;
  if (!fileInput.files || fileInput.files.length === 0) {
    toast('请选择要导入的文件', 'error');
    return;
  }
  var file = fileInput.files[0];
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.reports || !Array.isArray(data.reports)) {
        toast('文件格式不正确', 'error');
        return;
      }
      if (mode === 'replace') {
        reports = data.reports.map(function(r) {
          if (r.date) r.date = normalizeDate(r.date);
          return r;
        });
        if (data.templates) templates = data.templates;
        if (data.settings) settings = data.settings;
        if (data.meetings) meetings = data.meetings;
      } else {
        // Merge: add reports that don't have the same id
        var existingIds = reports.map(function(r) { return r.id; });
        var added = 0;
        data.reports.forEach(function(r) {
          if (existingIds.indexOf(r.id) < 0) {
            // Normalize date format to YYYY-MM-DD for consistent sorting
            if (r.date) r.date = normalizeDate(r.date);
            reports.push(r);
            existingIds.push(r.id);
            added++;
          }
        });
        // Merge templates
        if (data.templates) {
          var existingTplIds = templates.map(function(t) { return t.id; });
          data.templates.forEach(function(t) {
            if (existingTplIds.indexOf(t.id) < 0) templates.push(t);
          });
        }
        // Merge meetings
        if (data.meetings) {
          var existingMtgIds = meetings.map(function(m) { return m.id; });
          data.meetings.forEach(function(m) {
            if (existingMtgIds.indexOf(m.id) < 0) meetings.push(m);
          });
        }
      }
      persistReports();
      persistTemplates();
      persistSettings();
      persistMeetings();
      closeModal();
      toast('成功导入 ' + data.reports.length + ' 条报告数据', 'success');
      renderView(currentView);
      updateCounts();
    } catch(err) {
      toast('导入失败：' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

var _searchDebounce = null;
document.getElementById('searchInput').addEventListener('input', function(e) {
  var q = e.target.value.trim();
  if (!q) {
    renderView(currentView);
    return;
  }
  // Debounce: wait 300ms before searching
  if (_searchDebounce) clearTimeout(_searchDebounce);
  _searchDebounce = setTimeout(function() { doSearch(q); }, 300);
});

document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    var q = e.target.value.trim();
    if (q) {
      if (_searchDebounce) clearTimeout(_searchDebounce);
      doSearch(q);
    }
  }
});

function doSearch(q) {
  var ql = q.toLowerCase();
  var header = document.getElementById('mainHeader');
  var body = document.getElementById('mainBody');

  // Search in reports
  var reportResults = reports.filter(function(r) {
    var text = (r.title + ' ' + r.date + ' ' + (r.tags || []).join(' ') + ' ' + r.sections.map(function(s) { return s.title + ' ' + s.content; }).join(' ')).toLowerCase();
    return text.indexOf(ql) >= 0;
  });

  // Search in meetings
  var meetingResults = meetings.filter(function(m) {
    var text = (m.title + ' ' + m.date + ' ' + m.participants + ' ' + m.location + ' ' + m.description + ' ' + m.transcript + ' ' + m.minutes).toLowerCase();
    return text.indexOf(ql) >= 0;
  });

  var totalResults = reportResults.length + meetingResults.length;

  header.innerHTML = '<div class="main-title">搜索结果</div><div class="main-subtitle">找到 ' + totalResults + ' 条匹配 "' + escapeHtml(q) + '" 的结果</div>';

  var typeBadge = { daily: 'badge-daily', weekly: 'badge-weekly', monthly: 'badge-monthly', yearly: 'badge-yearly' };
  var typeText = { daily: '日报', weekly: '周报', monthly: '月报', yearly: '年报' };

/* getDefaultRange(type): returns {start, end} for weekly/monthly/yearly */
function getDefaultRange(type) {
  var now = new Date();
  if (type === 'weekly') {
    var wr = getWeekRange(now);
    return { start: dateStr(wr.start), end: dateStr(wr.end) };
  }
  if (type === 'monthly') {
    var s = new Date(now.getFullYear(), now.getMonth(), 1);
    var e = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    return { start: dateStr(s), end: dateStr(e) };
  }
  if (type === 'yearly') {
    var s2 = new Date(now.getFullYear(), 0, 1);
    var e2 = new Date(now.getFullYear(), 11, 31);
    return { start: dateStr(s2), end: dateStr(e2) };
  }
  return { start: dateStr(now), end: dateStr(now) };
}

/* getDefaultTitle(type, rangeStr): returns auto title */
function getDefaultTitle(type, range) {
  var s = parseDate(range.start);
  var e = parseDate(range.end);
  if (type === 'weekly') {
    return '周报 ' + formatDate(s, 'MM-DD') + '~' + formatDate(e, 'MM-DD');
  }
  if (type === 'monthly') {
    return '月报 ' + formatDate(s, 'YYYY年MM月');
  }
  if (type === 'yearly') {
    return '年报 ' + s.getFullYear();
  }
  return '报告';
}

/* collectDailyReports(startDate, endDate): returns sorted array of daily reports in range */
function collectDailyReports(startDate, endDate) {
  return reports.filter(function(r) {
    return r.type === 'daily' && parseDate(r.date) >= parseDate(startDate) && parseDate(r.date) <= parseDate(endDate);
  }).sort(function(a, b) {
    return parseDate(a.date) - parseDate(b.date);
  });
}

/* normalizeSectionTitle(title): maps various daily section titles to standard categories */
var SECTION_MAP = {
  '今日完成工作': 'done', '今日完成': 'done', '已完成工作': 'done', '今日工作完成': 'done',
  '进行中工作': 'ongoing', '进行中': 'ongoing', '未完成工作': 'ongoing',
  '明日工作计划': 'plan', '明日计划': 'plan', '下步计划': 'plan', '明日工作': 'plan',
  '需协调/风险': 'risk', '需协调': 'risk', '风险与协调': 'risk', '问题与风险': 'risk', '需协调事项': 'risk'
};

function categorizeSection(title) {
  var lower = (title || '').trim();
  if (SECTION_MAP[lower]) return SECTION_MAP[lower];
  // fuzzy match
  if (/完成/.test(lower) || /已做/.test(lower)) return 'done';
  if (/进行|未完|在途|跟进/.test(lower)) return 'ongoing';
  if (/计划|规划|下一步|后续|待办/.test(lower)) return 'plan';
  if (/协调|风险|问题|阻塞|支持/.test(lower)) return 'risk';
  return 'other:' + lower;
}

/* extractLineItems(text): splits text into individual bullet/line items */
function extractLineItems(text) {
  if (!text || !text.trim()) return [];
  var lines = text.split(/\n/).map(function(l) { return l.trim(); }).filter(Boolean);
  var items = [];
  lines.forEach(function(line) {
    // Remove common prefixes: "1. ", "1、", "- ", "• ", "•"
    var cleaned = line.replace(/^[\d]+[.、)]\s*/, '').replace(/^[-•·*\u25CF\u2022]\s*/, '').trim();
    if (cleaned) items.push(cleaned);
  });
  return items;
}

/* deduplicateItems(items): removes near-duplicate lines (case-insensitive, 70% similarity) */
function deduplicateItems(items) {
  var result = [];
  var seen = [];
  items.forEach(function(item) {
    var lower = item.toLowerCase();
    var isDup = false;
    for (var i = 0; i < seen.length; i++) {
      if (similarity(lower, seen[i]) > 0.7) {
        isDup = true;
        // Merge: keep the longer one
        if (item.length > result[i].length) result[i] = item;
        break;
      }
    }
    if (!isDup) {
      result.push(item);
      seen.push(lower);
    }
  });
  return result;
}

/* similarity(a, b): Levenshtein-based similarity ratio 0-1 */
function similarity(a, b) {
  if (a === b) return 1;
  if (!a.length || !b.length) return 0;
  var matrix = [];
  for (var i = 0; i <= b.length; i++) matrix[i] = [i];
  for (var j = 0; j <= a.length; j++) matrix[0][j] = j;
  for (var i2 = 1; i2 <= b.length; i2++) {
    for (var j2 = 1; j2 <= a.length; j2++) {
      if (b.charAt(i2 - 1) === a.charAt(j2 - 1)) {
        matrix[i2][j2] = matrix[i2 - 1][j2 - 1];
      } else {
        matrix[i2][j2] = Math.min(matrix[i2 - 1][j2 - 1] + 1, matrix[i2 - 1][j2] + 1, matrix[i2][j2 - 1] + 1);
      }
    }
  }
  var dist = matrix[b.length][a.length];
  return 1 - dist / Math.max(a.length, b.length);
}

/* groupItemsByKeyword(items): groups items sharing common keywords */
function groupItemsByKeyword(items) {
  var groups = [];
  items.forEach(function(item) {
    var matched = false;
    for (var i = 0; i < groups.length; i++) {
      // Check if shares a significant keyword (2+ chars)
      if (shareKeyword(item, groups[i].representative)) {
        groups[i].items.push(item);
        matched = true;
        break;
      }
    }
    if (!matched) {
      groups.push({ representative: item, items: [item] });
    }
  });
  return groups;
}

function shareKeyword(a, b) {
  // Extract 2+ char Chinese terms or significant words
  var termsA = extractKeywords(a);
  var termsB = extractKeywords(b);
  for (var i = 0; i < termsA.length; i++) {
    if (termsB.indexOf(termsA[i]) >= 0) return true;
  }
  return false;
}

function extractKeywords(text) {
  // Extract sequences of 2+ Chinese characters or 3+ alphanumeric
  var matches = text.match(/[\u4e00-\u9fa5]{2,}/g) || [];
  var alnum = text.match(/[a-zA-Z0-9]{3,}/g) || [];
  return matches.concat(alnum);
}

/* summarizeItems(items, maxCount): deduplicates, groups, and formats items into a summary string */
function summarizeItems(items, maxCount) {
  maxCount = maxCount || 20;
  if (items.length === 0) return '';
  var deduped = deduplicateItems(items);
  if (deduped.length <= maxCount) {
    return deduped.map(function(item, i) { return (i + 1) + '. ' + item; }).join('\n');
  }
  // Group by keyword and summarize
  var groups = groupItemsByKeyword(deduped);
  if (groups.length <= maxCount) {
    return groups.map(function(g, i) {
      if (g.items.length === 1) return (i + 1) + '. ' + g.items[0];
      return (i + 1) + '. ' + g.representative + '（' + g.items.length + '项）';
    }).join('\n');
  }
  // Too many: show top items by frequency
  groups.sort(function(a, b) { return b.items.length - a.items.length; });
  var shown = groups.slice(0, maxCount);
  var result = shown.map(function(g, i) {
    if (g.items.length === 1) return (i + 1) + '. ' + g.items[0];
    return (i + 1) + '. ' + g.representative + '（' + g.items.length + '项）';
  }).join('\n');
  result += '\n（其余 ' + (groups.length - maxCount) + ' 项已省略，详见日报）';
  return result;
}

/* extractAPIErrorMessage(raw, status): parse API error body (JSON or plain text) into readable message */
function extractAPIErrorMessage(raw, status) {
  var msg = '';
  if (raw) {
    raw = String(raw).trim();
    try {
      var errData = JSON.parse(raw);
      if (errData.error) msg = errData.error.message || '';
      else if (errData.message) msg = errData.message;
    } catch(e) {
      if (raw.length <= 300) msg = raw; // plain-text errors like "Authentication Fails ..."
    }
  }
  if (!msg) msg = 'HTTP ' + status;
  if (status === 401 || /authentication|unauthorized/i.test(raw || '')) {
    msg += '（认证失败：请检查 API Key 是否正确，并且已在设置页点击「保存设置」——只点测试连接不会保存）';
  }
  return msg;
}

/* getAIHeaders(): build request headers with auth (kept for compatibility) */
function getAIHeaders() {
  var headers = { 'Content-Type': 'application/json' };
  var apiKey = settings.aiApiKey || '';
  if (apiKey) headers['Authorization'] = 'Bearer ' + apiKey;
  return headers;
}

/* testAIConnection(): test API connectivity */
function testAIConnection() {
  var url = (document.getElementById('setAiApiUrl').value || '').trim().replace(/\/+$/, '');
  var model = (document.getElementById('setAiModel').value || '').trim();
  var apiKey = (document.getElementById('setAiApiKey').value || '').trim();
  var resultEl = document.getElementById('aiTestResult');
  var btnEl = document.getElementById('testAiBtn');
  if (!url) { resultEl.innerHTML = '<span style="color:var(--danger)">请填写 API 地址</span>'; return; }
  if (!apiKey) { resultEl.innerHTML = '<span style="color:var(--danger)">请填写 API Key</span>'; return; }
  resultEl.innerHTML = '<span style="color:var(--primary)">正在连接...</span>';
  btnEl.disabled = true;

  // 发送一个简单的测试请求
  var apiUrl = url + '/chat/completions';
  var requestBody = JSON.stringify({
    model: model,
    messages: [{ role: 'user', content: '你好' }],
    max_tokens: 5,
    stream: false
  });

  var isFileProtocol = (window.location.protocol === 'file:');

  if (isFileProtocol) {
    var xhr = new XMLHttpRequest();
    xhr.open('POST', apiUrl, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('Authorization', 'Bearer ' + apiKey);
    xhr.timeout = 15000;
    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {

/* callAI(prompt, onChunk, onDone, onError): streaming call to OpenAI-compatible API */
function callAI(prompt, onChunk, onDone, onError) {
  var baseUrl = (settings.aiApiUrl || 'https://api.deepseek.com/v1').replace(/\/+$/, '');
  var model = settings.aiModel || 'deepseek-chat';
  var apiKey = settings.aiApiKey || '';
  var apiUrl = baseUrl + '/chat/completions';
  var isFileProtocol = (window.location.protocol === 'file:');
  var requestBody = JSON.stringify({
    model: model,
    messages: [{ role: 'user', content: prompt }],
    stream: true,
    temperature: 0.3,
    max_tokens: 4096,
    top_p: 0.9
  });
  var headers = { 'Content-Type': 'application/json' };
  if (apiKey) headers['Authorization'] = 'Bearer ' + apiKey;

  if (isFileProtocol) {
    var xhr = new XMLHttpRequest();
    xhr.open('POST', apiUrl, true);
    for (var k in headers) xhr.setRequestHeader(k, headers[k]);
    xhr.responseType = 'text';
    var fullText = '';
    var lastIndex = 0;

    xhr.onprogress = function() {
      var newData = xhr.responseText.substring(lastIndex);
      lastIndex = xhr.responseText.length;
      var lines = newData.split('\n').filter(Boolean);
      lines.forEach(function(line) {
        line = line.replace(/^data: /, '').trim();
        if (line === '[DONE]') return;
        try {
          var obj = JSON.parse(line);
          var delta = obj.choices && obj.choices[0] && obj.choices[0].delta;
          if (delta && delta.content) {
            fullText += delta.content;
            if (onChunk) onChunk(delta.content, fullText);
          }
        } catch(e) {}
      });
    };
    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 300) {
        var remaining = xhr.responseText.substring(lastIndex);
        if (remaining.trim()) {
          var lines = remaining.split('\n').filter(Boolean);
          lines.forEach(function(line) {
            line = line.replace(/^data: /, '').trim();
            if (line === '[DONE]') return;
            try {
              var obj = JSON.parse(line);
              var delta = obj.choices && obj.choices[0] && obj.choices[0].delta;
              if (delta && delta.content) fullText += delta.content;
            } catch(e) {}
          });
        }
        if (fullText) onDone(fullText);
      } else {
        var errMsg = extractAPIErrorMessage(xhr.responseText, xhr.status);
        if (onError) onError(new Error(errMsg));
      }
    };
    xhr.onerror = function() {
      if (onError) onError(new Error('无法连接 API 服务'));
    };
    try { xhr.send(requestBody); } catch(e) { if (onError) onError(e); }
  } else {
    fetch(apiUrl, {
      method: 'POST',
      headers: headers,
      body: requestBody
    }).then(function(res) {
      if (!res.ok) {
        return res.text().then(function(raw) {
          throw new Error(extractAPIErrorMessage(raw, res.status));
        });
      }
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var fullText = '';
      function read() {
        reader.read().then(function(result) {
          if (result.done) { onDone(fullText); return; }
          var chunk = decoder.decode(result.value, { stream: true });
          var lines = chunk.split('\n').filter(Boolean);
          lines.forEach(function(line) {
            line = line.replace(/^data: /, '').trim();
            if (line === '[DONE]') return;
            try {
              var obj = JSON.parse(line);
              var delta = obj.choices && obj.choices[0] && obj.choices[0].delta;
              if (delta && delta.content) {
                fullText += delta.content;
                if (onChunk) onChunk(delta.content, fullText);
              }
            } catch(e) {}
          });
          read();
        }).catch(function(err) { if (onError) onError(err); });
      }
      read();
    }).catch(function(err) { if (onError) onError(err); });
  }
}

/* callAISync(prompt): non-streaming call, returns promise */
function callAISync(prompt) {
  var baseUrl = (settings.aiApiUrl || 'https://api.deepseek.com/v1').replace(/\/+$/, '');
  var model = settings.aiModel || 'deepseek-chat';
  var apiKey = settings.aiApiKey || '';

  return new Promise(function(resolve, reject) {
    var apiUrl = baseUrl + '/chat/completions';
    var isFileProtocol = (window.location.protocol === 'file:');
    var requestBody = JSON.stringify({
      model: model,
      messages: [{ role: 'user', content: prompt }],
      stream: false,
      temperature: 0.3,
      max_tokens: 4096,
      top_p: 0.9
    });
    var headers = { 'Content-Type': 'application/json' };
    if (apiKey) headers['Authorization'] = 'Bearer ' + apiKey;

    if (isFileProtocol) {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', apiUrl, true);
      for (var k in headers) xhr.setRequestHeader(k, headers[k]);
      xhr.responseType = 'text';
      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var data = JSON.parse(xhr.responseText);
            var content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
            resolve(content || '');
          } catch(e) { reject(new Error('解析响应失败')); }
        } else {
          var errMsg = extractAPIErrorMessage(xhr.responseText, xhr.status);
          reject(new Error(errMsg));
        }
      };
      xhr.onerror = function() { reject(new Error('无法连接 API 服务')); };
      try { xhr.send(requestBody); } catch(e) { reject(e); }
    } else {
      fetch(apiUrl, {
        method: 'POST',
        headers: headers,
        body: requestBody
      }).then(function(res) {
        if (!res.ok) {
          return res.text().then(function(raw) {
            throw new Error(extractAPIErrorMessage(raw, res.status));
          });
        }
        return res.json();
      }).then(function(data) {
        var content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
        resolve(content || '');
      }).catch(function(err) {
        reject(err);
      });
    }
  });
}

/* buildAIPrompt(type, dailyReports, template, customPrompt): constructs the prompt for AI generation */
function buildAIPrompt(type, dailyReports, template, customPrompt) {
  var typeText = { weekly: '周报', monthly: '月报', yearly: '年报' }[type] || '报告';
  var periodText = { weekly: '本周', monthly: '本月', yearly: '本年度' }[type] || '本期';

  // Organize daily report content by date
  var dailyContent = dailyReports.map(function(r) {
    var sections = r.sections.map(function(s) {
      return '【' + s.title + '】\n' + (s.content || '（无内容）');
    }).join('\n');
    return '--- ' + formatDate(parseDate(r.date), 'MM月DD日') + ' 日报 ---\n' + sections;
  }).join('\n\n');

  // Template sections description
  var tplSections = template.sections.map(function(s, i) {
    return (i + 1) + '. ' + s.title + (s.hint ? '（' + s.hint + '）' : '');
  }).join('\n');

  // Free mode: when user provides a custom prompt, follow it as the dominant instruction,
  // treat daily reports as reference material only, and do NOT force the template structure.
  var custom = (customPrompt || '').trim();
  if (custom) {
    return '你是一位专业的职场工作汇报撰写助手。\n\n' +
      '任务：根据以下日报素材，严格按用户的要求撰写一份' + periodText + typeText + '。\n\n' +
      '用户要求（必须优先遵循，决定内容的组织方式、风格和结构）：\n' +
      custom + '\n\n' +
      '日报素材（仅作为内容参考，组织方式由用户要求决定）：\n' +
      dailyContent + '\n\n' +
      '直接输出报告内容，不要输出思考过程，不要额外说明：';
  }

  // Default mode: structured template output
  var prompt = '你是一位专业的职场工作汇报撰写助手。\n\n' +
    '任务：请根据以下' + periodText + '日报内容，撰写一份完整的' + periodText + typeText + '。\n\n' +
    '要求：\n' +
    '- 将多篇日报内容归纳总结为一份综合报告，而非逐日罗列\n' +
    '- 合并同类工作事项，去除重复，提炼核心进展\n' +
    '- 语言专业、简洁、逻辑清晰\n' +
    '- 突出重点工作成果和关键数据\n' +
    '- 每个板块用编号列表呈现，如 1. 2. 3.\n';

  prompt += '\n报告类型：' + periodText + typeText + '\n' +
    '日报时间范围：' + formatDate(parseDate(dailyReports[0].date), 'YYYY-MM-DD') + ' 至 ' + formatDate(parseDate(dailyReports[dailyReports.length - 1].date), 'YYYY-MM-DD') + '\n' +
    '日报篇数：' + dailyReports.length + ' 篇\n\n' +
    '报告包含以下板块：\n' + tplSections + '\n\n' +
    '以下是日报原始内容：\n' + dailyContent + '\n\n' +
    '请按以下格式输出（每个板块用 === 标题 === 包裹）：\n';

  template.sections.forEach(function(s) {
    prompt += '\n===' + s.title + '===\n（在此填写该板块内容）';
  });

  prompt += '\n\n请直接输出报告内容，不要输出思考过程：';

  return prompt;
}

/* parseAIResponse(response, template, freeMode): parse AI output into sections array */
function parseAIResponse(response, template, freeMode) {
  var sections = [];

  // Free mode: keep the AI output as-is (one section), do NOT force template structure
  if (freeMode) {
    sections.push({
      title: '报告内容',
      hint: '',
      content: response.trim()
    });
    return sections;
  }

  // Try to parse ===板块标题=== format
  var regex = /===([^=]+)===\n([\s\S]*?)(?====|$)/g;
  var match;
  var parsed = {};
  var parsedOrder = [];
  while ((match = regex.exec(response)) !== null) {
    var title = match[1].trim();
    var content = match[2].trim();
    if (!parsed[title]) { parsed[title] = content; parsedOrder.push(title); }
  }

  // If structured format found, map to template sections
  if (parsedOrder.length > 0) {
    template.sections.forEach(function(tplSection) {
      var content = '';
      // Try exact match first
      if (parsed[tplSection.title]) {
        content = parsed[tplSection.title];
      } else {
        // Fuzzy match: find best matching section by shared keywords
        var bestKey = null;
        var bestScore = 0;
        parsedOrder.forEach(function(key) {
          var score = 0;
          var kws = extractKeywords(key);
          var titleKws = extractKeywords(tplSection.title);
          kws.forEach(function(kw) {
            if (titleKws.indexOf(kw) >= 0) score++;
          });
          if (score > bestScore) { bestScore = score; bestKey = key; }
        });
        if (bestKey && bestScore > 0) content = parsed[bestKey];
      }
      sections.push({ title: tplSection.title, hint: tplSection.hint, content: content });
    });
    return sections;
  }

  // Fallback: try splitting by numbered headers like "一、", "二、" or "1." "2."
  var parts = response.split(/\n(?=[一二三四五六七八九十]+[、.．]\s)/);
  if (parts.length >= template.sections.length) {
    template.sections.forEach(function(tplSection, idx) {
      sections.push({ title: tplSection.title, hint: tplSection.hint, content: (parts[idx] || '').trim() });
    });
    return sections;
  }

  // Last fallback: put everything in the first section
  template.sections.forEach(function(tplSection, idx) {
    sections.push({
      title: tplSection.title,
      hint: tplSection.hint,
      content: idx === 0 ? response.trim() : ''
    });
  });

  return sections;
}

/* aiGenerateReport(type, startDate, endDate, templateId, onProgress, onDone, customPrompt): AI-powered generation */
function aiGenerateReport(type, startDate, endDate, templateId, onProgress, onDone, customPrompt) {
  var dailyReports = collectDailyReports(startDate, endDate);
  var tpl = templateId ? getTemplate(templateId) : getTemplateByType(type);
  var custom = (customPrompt || '').trim();

  if (dailyReports.length === 0) {
    onDone(null, new Error('所选日期范围内没有日报数据'));
    return;
  }

  var prompt = buildAIPrompt(type, dailyReports, tpl, customPrompt);

  // Streaming call
  var fullText = '';
  callAI(
    prompt,
    function(chunk, accumulated) {
      // Clean thinking tags for display
      var display = cleanThinkingTags(accumulated);
      fullText = accumulated;
      onProgress(display, false);
    },
    function(finalText) {
      var cleaned = cleanThinkingTags(finalText);
      // Parse AI response into sections (free mode keeps output as-is)
      var sections = parseAIResponse(cleaned, tpl, !!custom);
      var result = {
        title: getDefaultTitle(type, { start: startDate, end: endDate }),
        type: type,
        date: dateStr(new Date()),
        status: 'draft',
        tags: extractAITags(finalText),
        templateId: tpl.id,
        sections: sections,
        sourceCount: dailyReports.length,
        sourceDates: dailyReports.map(function(r) { return r.date; }),
        generatedBy: 'ai'
      };
      onDone(result, null);
    },
    function(err) {
      onDone(null, err);
    }
  );
}

/* cleanThinkingTags(text): remove DeepSeek-R1 </think>...` tags */
function cleanThinkingTags(text) {
  // Remove <think>...</think> blocks (may span multiple lines)
  var cleaned = text.replace(/<think>[\s\S]*?<\/think>/g, '');
  // Handle unclosed <think> tag (streaming may end mid-thought)
  cleaned = cleaned.replace(/<think>[\s\S]*/g, '');
  // Also remove </think> markers if any remain
  cleaned = cleaned.replace(/<\/think>/g, '');
  return cleaned.trim();
}

/* extractAITags(text): extract potential tags from AI response */
function extractAITags(text) {
  var tags = [];
  var keywords = extractKeywords(text);
  var unique = {};
  keywords.forEach(function(kw) {
    if (!unique[kw] && tags.length < 5) {
      unique[kw] = true;
      tags.push(kw);
    }
  });
  return tags;
}

/* generateAggregatedReport(type, startDate, endDate, templateId): main aggregation logic */
function generateAggregatedReport(type, startDate, endDate, templateId) {
  var dailyReports = collectDailyReports(startDate, endDate);
  var tpl = templateId ? getTemplate(templateId) : getTemplateByType(type);

  // Collect all section contents categorized
  var buckets = { done: [], ongoing: [], plan: [], risk: [], other: {} };
  var allTags = [];
  var reportDates = [];

  dailyReports.forEach(function(r) {
    reportDates.push(r.date);
    if (r.tags) allTags = allTags.concat(r.tags);
    r.sections.forEach(function(s) {
      var cat = categorizeSection(s.title);
      var items = extractLineItems(s.content);
      if (cat === 'done' || cat === 'ongoing' || cat === 'plan' || cat === 'risk') {
        buckets[cat] = buckets[cat].concat(items);
      } else {
        var key = cat; // 'other:Title'
        if (!buckets.other[key]) buckets.other[key] = [];
        buckets.other[key] = buckets.other[key].concat(items);
      }
    });
  });

  // Deduplicate tags
  var uniqueTags = [];
  allTags.forEach(function(t) { if (uniqueTags.indexOf(t) < 0) uniqueTags.push(t); });

  // Build section content based on target template
  var sections = (tpl.sections || []).map(function(tplSection) {
    var cat = categorizeSection(tplSection.title);
    var content = '';

    if (cat === 'done') {
      content = summarizeItems(buckets.done, 20);
    } else if (cat === 'ongoing') {
      content = summarizeItems(buckets.ongoing, 10);
    } else if (cat === 'plan') {
      // Plan from daily "明日计划" items, take the last few unique ones
      var planItems = deduplicateItems(buckets.plan);
      content = summarizeItems(planItems.slice(-10), 10);
    } else if (cat === 'risk') {
      // Collect risk items, exclude "无"
      var riskItems = buckets.risk.filter(function(item) {
        return item !== '无' && item !== '暂无' && item !== '无事项';
      });
      content = riskItems.length > 0 ? summarizeItems(riskItems, 10) : '本期无特殊需协调事项';
    } else if (/概述|总结|回顾/.test(tplSection.title)) {
      // Overview section: generate a summary
      content = generateOverview(dailyReports, startDate, endDate, type);
    } else if (/指标|数据|KPI|达成/.test(tplSection.title)) {
      content = generateDataSummary(buckets, dailyReports.length);
    } else if (/问题|分析|反思|不足|经验|教训/.test(tplSection.title)) {
      content = generateIssuesAnalysis(buckets);
    } else if (/规划|下月|下年|来年|下一步|展望/.test(tplSection.title)) {
      content = summarizeItems(buckets.plan, 10) || '请根据工作进展补充下阶段规划';
    } else if (/里程碑|成果|重点/.test(tplSection.title)) {
      content = summarizeItems(buckets.done, 15) || '请根据日报内容补充重点成果';
    } else {
      // For other sections, try to find matching "other" bucket
      var otherKey = 'other:' + tplSection.title;
      if (buckets.other[otherKey]) {
        content = summarizeItems(buckets.other[otherKey], 15);
      }
    }

    return { title: tplSection.title, hint: tplSection.hint, content: content };
  });

  return {
    title: getDefaultTitle(type, { start: startDate, end: endDate }),
    type: type,
    date: dateStr(new Date()),
    status: 'draft',
    tags: uniqueTags.slice(0, 5),
    templateId: tpl.id,
    sections: sections,
    sourceCount: dailyReports.length,
    sourceDates: reportDates
  };
}

function generateOverview(dailyReports, startDate, endDate, type) {
  if (dailyReports.length === 0) {
    var typeText2 = { weekly: '本周', monthly: '本月', yearly: '本年度' };
    return typeText2[type] + '暂无日报数据，请先编写日报。';
  }
  var typeText = { weekly: '本周', monthly: '本月', yearly: '本年度' };
  var typePeriod = typeText[type] || '本期';
  var allItems = [];
  dailyReports.forEach(function(r) {
    r.sections.forEach(function(s) {
      var cat = categorizeSection(s.title);
      if (cat === 'done') {
        allItems = allItems.concat(extractLineItems(s.content));
      }
    });
  });
  var uniqueItems = deduplicateItems(allItems);
  var summary = typePeriod + '共记录日报 ' + dailyReports.length + ' 篇（' +
    formatDate(parseDate(startDate), 'MM-DD') + ' ~ ' + formatDate(parseDate(endDate), 'MM-DD') + '），' +
    '涉及 ' + uniqueItems.length + ' 项主要工作内容。';
  // List top categories/projects
  var projects = {};
  uniqueItems.forEach(function(item) {
    var kws = extractKeywords(item);
    kws.forEach(function(kw) {
      if (kw.length >= 2) projects[kw] = (projects[kw] || 0) + 1;
    });
  });
  var topProjects = Object.keys(projects).sort(function(a, b) { return projects[b] - projects[a]; }).slice(0, 3);
  if (topProjects.length > 0) {
    summary += '主要工作集中在：' + topProjects.join('、') + '等方面。';
  }
  return summary;
}

function generateDataSummary(buckets, reportCount) {
  var doneCount = buckets.done.length;
  var ongoingCount = buckets.ongoing.length;
  var riskCount = buckets.risk.filter(function(i) { return i !== '无' && i !== '暂无'; }).length;
  return '日报数量：' + reportCount + ' 篇\n' +
    '已完成事项：' + doneCount + ' 项\n' +
    '进行中事项：' + ongoingCount + ' 项\n' +
    '需协调/风险事项：' + riskCount + ' 项';
}

function generateIssuesAnalysis(buckets) {
  var risks = buckets.risk.filter(function(i) { return i !== '无' && i !== '暂无' && i !== '无事项'; });
  if (risks.length === 0) {
    return '本期工作整体推进顺利，无重大风险与问题。';
  }
  var deduped = deduplicateItems(risks);
  return '本期需关注的事项：\n' + deduped.map(function(item, i) {
    return (i + 1) + '. ' + item;
  }).join('\n');
}

/* =========================================================================
   AUTO-GENERATION MODAL
   ========================================================================= */
var autoGenData = null; // Holds the generated report before saving

function openAutoGen(type) {
  autoGenData = null;

  var typeText = { weekly: '周报', monthly: '月报', yearly: '年报' }[type];

function updateAgPreview() {
  var startEl = document.getElementById('agStart');
  var endEl = document.getElementById('agEnd');
  var statsEl = document.getElementById('agStats');
  if (!startEl || !endEl) return;

  var startDate = startEl.value;
  var endDate = endEl.value;
  var dailyReports = collectDailyReports(startDate, endDate);

  // Update stats
  if (dailyReports.length === 0) {
    statsEl.innerHTML = '<div style="text-align:center;color:var(--danger);font-size:13px;padding:8px">' +
      '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="vertical-align:middle;margin-right:4px"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>' +
      '所选日期范围内没有日报数据，请先编写日报或调整日期范围</div>';
  } else {
    var allItems = 0, allDone = 0, allRisk = 0;
    dailyReports.forEach(function(r) {
      r.sections.forEach(function(s) {
        var cat = categorizeSection(s.title);
        var items = extractLineItems(s.content);
        allItems += items.length;
        if (cat === 'done') allDone += items.length;
        if (cat === 'risk') allRisk += items.filter(function(i){return i!=='无'&&i!=='暂无';}).length;
      });
    });
    statsEl.innerHTML = '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center">' +
      '<div><div style="font-size:20px;font-weight:700;color:var(--primary)">' + dailyReports.length + '</div><div style="font-size:11px;color:var(--text-muted)">日报篇数</div></div>' +
      '<div><div style="font-size:20px;font-weight:700;color:var(--success)">' + allDone + '</div><div style="font-size:11px;color:var(--text-muted)">完成事项</div></div>' +
      '<div><div style="font-size:20px;font-weight:700;color:var(--info)">' + allItems + '</div><div style="font-size:11px;color:var(--text-muted)">总条目</div></div>' +
      '<div><div style="font-size:20px;font-weight:700;color:var(--warning)">' + allRisk + '</div><div style="font-size:11px;color:var(--text-muted)">风险事项</div></div>' +
    '</div>' +
    '<div style="margin-top:10px;font-size:12px;color:var(--text-muted)">' +
      '覆盖日期：' + formatDate(parseDate(dailyReports[0].date), 'MM-DD') + ' ~ ' + formatDate(parseDate(dailyReports[dailyReports.length-1].date), 'MM-DD') + '' +
      (dailyReports.length < (parseDate(endDate) - parseDate(startDate)) / 86400000 + 1 ? '（部分日期无日报）' : '') +
    '</div>';
  }
}

function doAutoGen() {
  var startDate = document.getElementById('agStart').value;
  var endDate = document.getElementById('agEnd').value;
  var templateId = document.getElementById('agTemplate').value;
  var type = getTemplate(templateId).type;
  var useAI = settings.aiEnabled !== false; // default to AI mode
  var customPrompt = '';
  var promptEl = document.getElementById('agPrompt');
  if (promptEl) customPrompt = promptEl.value.trim();

  var dailyReports = collectDailyReports(startDate, endDate);
  if (dailyReports.length === 0) {
    toast('所选日期范围内没有日报数据', 'error');
    return;
  }

  // Add keyframe for spinner
  if (!document.getElementById('spinKf')) {
    var style = document.createElement('style');
    style.id = 'spinKf';
    style.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
    document.head.appendChild(style);
  }

  if (useAI) {
    // AI Mode: streaming generation
    document.getElementById('agPreview').innerHTML = '<div style="text-align:center;padding:40px;color:var(--primary)">' +
      '<div style="display:inline-block;width:32px;height:32px;border:3px solid var(--primary-100);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px"></div>' +
      '<div style="font-size:14px;font-weight:600">AI 正在智能生成...</div>' +
      '<div style="font-size:12px;color:var(--text-muted);margin-top:4px">基于 ' + dailyReports.length + ' 篇日报 · 模型：' + escapeHtml(settings.aiModel || 'deepseek-chat') + '</div>' +
      '</div>';

    // Disable buttons during generation
    var genBtn = document.querySelector('.modal-footer .btn-primary');
    if (genBtn) { genBtn.disabled = true; genBtn.style.opacity = '0.5'; }

    aiGenerateReport(type, startDate, endDate, templateId,
      function(streamText, done) {
        // Streaming update: show real-time output
        if (!done) {
          var previewEl = document.getElementById('agPreview');
          if (previewEl && streamText) {
            var displayHtml = escapeHtml(streamText).replace(/\n/g, '<br>');
            previewEl.innerHTML = '<div style="padding:16px;background:var(--bg);border-radius:var(--radius);margin-bottom:12px">' +
              '<div style="font-size:11px;color:var(--primary);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px">' +
              '<span style="display:inline-block;width:10px;height:10px;border:2px solid var(--primary-100);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite"></span>' +
              'AI 生成中...</div>' +
              '<div id="agStreamContent" style="font-size:13px;line-height:1.8;color:var(--text-secondary);white-space:pre-wrap;max-height:400px;overflow-y:auto;word-break:break-word">' + displayHtml + '</div>' +
              '</div>';
            // Auto-scroll to bottom to show latest output
            var streamEl = document.getElementById('agStreamContent');
            if (streamEl) streamEl.scrollTop = streamEl.scrollHeight;
          }
        }
      },
      function(result, err) {
        // Re-enable buttons
        if (genBtn) { genBtn.disabled = false; genBtn.style.opacity = '1'; }

        if (err || !result) {
          // AI failed, fallback to rule-based generation
          toast('AI 生成失败（' + (err ? err.message : '未知错误') + '），已切换到规则聚合模式', 'error');
          autoGenData = generateAggregatedReport(type, startDate, endDate, templateId);
          autoGenData.generatedBy = 'rule';
          renderAgPreview(autoGenData);
          document.getElementById('agSaveBtn').style.display = 'inline-flex';
          document.getElementById('agEditBtn').style.display = 'inline-flex';
          toast('已使用规则聚合方式生成，可预览确认', 'info');
          return;
        }

        // AI success
        autoGenData = result;
        renderAgPreview(autoGenData);
        document.getElementById('agSaveBtn').style.display = 'inline-flex';
        document.getElementById('agEditBtn').style.display = 'inline-flex';
        toast('AI 已生成' + (type === 'weekly' ? '周报' : type === 'monthly' ? '月报' : '年报') + '初稿，请预览确认', 'success');
      },
      customPrompt
    );
  } else {
    // Rule-based mode (original logic)
    document.getElementById('agPreview').innerHTML = '<div style="text-align:center;padding:40px;color:var(--primary)">' +
      '<div style="display:inline-block;width:32px;height:32px;border:3px solid var(--primary-100);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px"></div>' +
      '<div style="font-size:14px;font-weight:600">正在智能汇总 ' + dailyReports.length + ' 篇日报...</div>' +
      '<div style="font-size:12px;color:var(--text-muted);margin-top:4px">分类 · 去重 · 聚类</div></div>';

    setTimeout(function() {
      autoGenData = generateAggregatedReport(type, startDate, endDate, templateId);
      autoGenData.generatedBy = 'rule';
      renderAgPreview(autoGenData);
      document.getElementById('agSaveBtn').style.display = 'inline-flex';
      document.getElementById('agEditBtn').style.display = 'inline-flex';
      toast('已生成' + (type === 'weekly' ? '周报' : type === 'monthly' ? '月报' : '年报') + '初稿，请预览确认', 'success');
    }, 600);
  }
}

    id: uid(),
    title: autoGenData.title,
    type: autoGenData.type,
    date: autoGenData.date,
    status: 'draft',
    tags: autoGenData.tags,
    templateId: autoGenData.templateId,
    sections: autoGenData.sections,
    generatedFrom: 'auto', // mark as auto-generated

function editAutoGen() {

/* =========================================================================
   REMINDERS CHECK
   ========================================================================= */
function checkReminders() {
  var now = new Date();
  var today = dateStr(now);
  var hour = now.getHours();

  // Check if already reminded today
  var remindedKey = 'wr_reminded_' + today;
  if (localStorage.getItem(remindedKey)) return;

  var pendingReminders = [];

  // Daily reminder
  if (hour >= settings.remindDaily) {
    var hasDaily = reports.some(function(r) { return r.type === 'daily' && r.date === today; });
    if (!hasDaily) {
      pendingReminders.push({ type: 'daily', msg: '今天的日报还没写哦，别忘了记录今天的工作！' });
    }
  }

  // Weekly reminder (Friday)
  if (now.getDay() === 5 && hour >= 17) {
    var weekRange = getWeekRange(now);
    var hasWeekly = reports.some(function(r) {
      return r.type === 'weekly' && parseDate(r.date) >= parseDate(dateStr(weekRange.start)) && parseDate(r.date) <= parseDate(dateStr(weekRange.end));
    });
    if (!hasWeekly) {
      pendingReminders.push({ type: 'weekly', msg: '本周周报还没写，周末前完成总结吧！' });
    }
  }

  // Monthly reminder
  if (now.getDate() >= settings.remindMonthly && now.getDate() <= settings.remindMonthly + 2) {
    var hasMonthly = reports.some(function(r) {
      return r.type === 'monthly' && r.date.indexOf(formatDate(now, 'YYYY-MM')) === 0;
    });
    if (!hasMonthly) {
      pendingReminders.push({ type: 'monthly', msg: '本月月报还没写，记得安排时间复盘！' });
    }
  }

  if (pendingReminders.length > 0) {
    localStorage.setItem(remindedKey, '1');
    setTimeout(function() {
      pendingReminders.forEach(function(r, i) {
        setTimeout(function() {
          toast(r.msg, 'info');
        }, i * 500);
      });
    }, 1500);
  }
}

/* ---- Audio Recording ---- */
function toggleMeetingRecording() {
  if (meetingIsRecording) {
    stopMeetingRecording();
  } else {
    startMeetingRecording();
  }
}

function startMeetingRecording() {
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
    meetingIsRecording = true;
    meetingRecordedChunks = [];
    meetingRecordingStart = Date.now();

    var btn = document.getElementById('mtRecordBtn');
    btn.innerHTML = '<span class="rec-dot" style="width:8px;height:8px;border-radius:50%;background:var(--danger);animation:recPulse 1.2s infinite"></span>停止录音';
    btn.className = 'btn btn-danger';

    var statusEl = document.getElementById('mtRecStatus');
    statusEl.innerHTML = '<span class="recording-indicator"><span class="rec-dot"></span>录音中</span><span id="mtRecTimer" style="margin-left:8px">00:00</span>';

    // Timer
    meetingRecordingTimer = setInterval(function() {
      var elapsed = Date.now() - meetingRecordingStart;
      var min = Math.floor(elapsed / 60000);
      var sec = Math.floor((elapsed % 60000) / 1000);
      var el = document.getElementById('mtRecTimer');
      if (el) el.textContent = (min < 10 ? '0' + min : min) + ':' + (sec < 10 ? '0' + sec : sec);
    }, 1000);

    // MediaRecorder for audio file
    try {
      meetingRecorder = new MediaRecorder(stream);
    } catch(e) {
      // Fallback
      meetingRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
    }
    meetingRecorder.ondataavailable = function(e) {
      if (e.data.size > 0) meetingRecordedChunks.push(e.data);
    };
    meetingRecorder.onstop = function() {
      var blob = new Blob(meetingRecordedChunks, { type: 'audio/webm' });
      var url = URL.createObjectURL(blob);
      showAudioPlayer(url);

      // Also start speech recognition for live transcript
      var transcriptEl = document.getElementById('mtTranscript');
      if (transcriptEl) {
        var existing = transcriptEl.value || '';
        if (existing && !existing.endsWith('\n')) existing += '\n\n';
        existing += '【录音 ' + formatDate(new Date(), 'HH:mm') + ' 开始】\n';
        transcriptEl.value = existing;
      }

      // Stop all tracks
      stream.getTracks().forEach(function(t) { t.stop(); });
    };
    meetingRecorder.start(1000);

    // Also run live SpeechRecognition for transcript
    startLiveSpeechRecognition();

    toast('录音已开始', 'info');
  }).catch(function(err) {
    toast('无法访问麦克风：' + err.message, 'error');
  });
}

function stopMeetingRecording() {
  meetingIsRecording = false;

  if (meetingRecorder && meetingRecorder.state !== 'inactive') {
    meetingRecorder.stop();
  }

  if (meetingRecognition) {
    try { meetingRecognition.stop(); } catch(e) {}
    meetingRecognition = null;
  }

  if (meetingRecordingTimer) {
    clearInterval(meetingRecordingTimer);
    meetingRecordingTimer = null;
  }

  var btn = document.getElementById('mtRecordBtn');
  if (btn) {
    btn.innerHTML = '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>开始录音';
    btn.className = 'btn btn-primary';
  }

  var statusEl = document.getElementById('mtRecStatus');
  if (statusEl) statusEl.innerHTML = '<span style="color:var(--success)">录音完成</span>';

  toast('录音已停止', 'success');
}

function startLiveSpeechRecognition() {
  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return; // Not supported, user can upload file

  meetingRecognition = new SpeechRecognition();
  meetingRecognition.lang = 'zh-CN';
  meetingRecognition.continuous = true;
  meetingRecognition.interimResults = true;

  var finalTranscript = '';
  meetingRecognition.onresult = function(event) {
    var interim = '';
    for (var i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        finalTranscript += event.results[i][0].transcript + '\n';
      } else {
        interim += event.results[i][0].transcript;
      }
    }
    var transcriptEl = document.getElementById('mtTranscript');
    if (transcriptEl) {
      var existing = (transcriptEl.value || '').split('【录音')[0];
      transcriptEl.value = existing + '【录音实时转录】\n' + finalTranscript + interim;
    }
  };

  meetingRecognition.onerror = function(event) {
    // Silently restart if possible
    if (event.error === 'no-speech' || event.error === 'aborted') return;
  };

  meetingRecognition.onend = function() {
    // Auto-restart if still recording
    if (meetingIsRecording) {
      try { meetingRecognition.start(); } catch(e) {}
    }
  };

  try { meetingRecognition.start(); } catch(e) {}
}

function showAudioPlayer(url) {
  var playerDiv = document.getElementById('mtAudioPlayer');
  var audioEl = document.getElementById('mtAudioEl');
  if (playerDiv && audioEl) {
    audioEl.src = url;
    playerDiv.style.display = 'flex';
  }
}

function removeMeetingAudio() {
  var playerDiv = document.getElementById('mtAudioPlayer');
  var audioEl = document.getElementById('mtAudioEl');

/* ---- Audio File Upload ---- */
function handleAudioUpload(input) {
  if (!input.files || !input.files.length) return;
  var file = input.files[0];
  processAudioFile(file);
}

function handleAudioDrop(event) {
  var files = event.dataTransfer.files;
  if (!files || !files.length) return;
  if (files[0].type.startsWith('audio/') || /\.(mp3|wav|m4a|ogg|flac)$/i.test(files[0].name)) {
    processAudioFile(files[0]);
  } else {
    toast('请上传音频文件', 'error');
  }
}

var _meetingAudioFile = null;

function processAudioFile(file) {
  if (file.size > 500 * 1024 * 1024) {
    toast('文件大小超过 500MB 限制', 'error');
    return;
  }
  _meetingAudioFile = file;
  var url = URL.createObjectURL(file);
  showAudioPlayer(url);
  toast('音频文件已加载：' + file.name, 'success');
}

var _realtimeRecognition = null;
var _realtimeFinalText = '';

function startRealtimeSTT() {
  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { toast('浏览器不支持语音识别', 'error'); return; }

  _realtimeFinalText = '';
  _realtimeRecognition = new SpeechRecognition();
  _realtimeRecognition.lang = 'zh-CN';
  _realtimeRecognition.continuous = true;
  _realtimeRecognition.interimResults = true;

  document.getElementById('rtStartBtn').style.display = 'none';
  document.getElementById('rtStopBtn').style.display = 'inline-flex';
  document.getElementById('rtStatus').innerHTML = '<span class="recording-indicator"><span class="rec-dot"></span>识别中</span>';

  var output = document.getElementById('rtOutput');
  output.classList.remove('empty');

  _realtimeRecognition.onresult = function(event) {
    var interim = '';
    for (var i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        _realtimeFinalText += event.results[i][0].transcript + '\n';
      } else {
        interim += event.results[i][0].transcript;
      }
    }
    output.textContent = _realtimeFinalText + interim;
    output.scrollTop = output.scrollHeight;
  };

  _realtimeRecognition.onerror = function(e) {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
  };

  _realtimeRecognition.onend = function() {
    // Restart if still "recording"
    if (document.getElementById('rtStopBtn').style.display !== 'none') {
      try { _realtimeRecognition.start(); } catch(e) {}
    }
  };

  try { _realtimeRecognition.start(); } catch(e) { toast('启动识别失败', 'error'); }
}

function stopRealtimeSTT() {
  if (_realtimeRecognition) {
    try { _realtimeRecognition.stop(); } catch(e) {}
    _realtimeRecognition = null;
  }
  document.getElementById('rtStartBtn').style.display = 'inline-flex';
  document.getElementById('rtStopBtn').style.display = 'none';
  document.getElementById('rtStatus').innerHTML = '<span style="color:var(--success)">识别完成</span>';
}

function applyRealtimeTranscript() {
  stopRealtimeSTT();
  var transcriptEl = document.getElementById('mtTranscript');
  if (transcriptEl && _realtimeFinalText.trim()) {
    var existing = transcriptEl.value || '';
    if (existing && !existing.endsWith('\n')) existing += '\n\n';
    transcriptEl.value = existing + '【实时语音识别】\n' + _realtimeFinalText.trim();
  }
  closeModal();
  toast('已将识别内容应用到转录文本', 'success');
}

/* ---- Audio Transcription via Whisper ---- */
function transcribeMeetingAudio() {
  var statusEl = document.getElementById('mtTranscribeStatus');
  var audioFile = _meetingAudioFile;

  // Check if there's audio data from recording
  if (!audioFile && meetingRecordedChunks.length > 0) {
    audioFile = new Blob(meetingRecordedChunks, { type: 'audio/webm' });
  }

  if (!audioFile) {
    toast('请先录制或上传音频文件', 'error');
    return;
  }

  var baseUrl = (settings.whisperApiUrl || settings.aiApiUrl || 'http://localhost:11434').replace(/\/+$/, '');
  statusEl.innerHTML = '<span style="color:var(--primary)">正在转录...</span>';

  // Use Ollama Whisper API (POST /api/transcribe with audio file)
  var formData = new FormData();
  formData.append('file', audioFile, 'audio.webm');
  formData.append('model', settings.whisperModel || 'whisper');

  // Try Ollama whisper endpoint
  fetch(baseUrl + '/api/transcribe', {
    method: 'POST',
    body: formData
  }).then(function(res) {
    if (!res.ok) throw new Error('API 返回 ' + res.status);
    return res.json();
  }).then(function(data) {
    var text = data.text || data.transcript || '';
    if (text) {
      var transcriptEl = document.getElementById('mtTranscript');
      var existing = transcriptEl.value || '';
      if (existing && !existing.endsWith('\n')) existing += '\n\n';
      transcriptEl.value = existing + '【Whisper 转录】\n' + text;
      statusEl.innerHTML = '<span style="color:var(--success)">转录完成</span>';
      toast('语音转录完成', 'success');
    } else {
      statusEl.innerHTML = '<span style="color:var(--warning)">转录结果为空</span>';
    }
  }).catch(function(err) {
    statusEl.innerHTML = '<span style="color:var(--danger)">转录失败：' + escapeHtml(err.message) + '</span>';
    toast('Whisper 转录失败，请确认 Ollama Whisper 模型已加载（语音转写仍需本地 Ollama）', 'error');
  });
}

/* ---- AI Generate Meeting Minutes ---- */
function generateMeetingMinutes() {
  var transcript = (document.getElementById('mtTranscript').value || '').trim();
  if (!transcript) {
    toast('请先添加会议转录内容', 'error');
    return;
  }

  var title = document.getElementById('mtTitle').value || '未命名会议';
  var date = document.getElementById('mtDate').value || '';
  var time = document.getElementById('mtTime').value || '';
  var location = document.getElementById('mtLocation').value || '';
  var participants = document.getElementById('mtParticipants').value || '';
  var description = document.getElementById('mtDescription').value || '';

  if (settings.aiEnabled === false) {
    // Rule-based fallback
    var simpleMinutes = '会议标题：' + title + '\n' +
      '会议时间：' + date + (time ? ' ' + time : '') + '\n' +
      '会议地点：' + (location || '未指定') + '\n' +
      '参会人员：' + (participants || '未指定') + '\n\n' +
      '会议内容：\n' + transcript;
    document.getElementById('mtMinutes').value = simpleMinutes;
    toast('已生成简要纪要（规则模式），建议开启 AI 获得更结构化的结果', 'info');
    return;
  }

  var statusEl = document.getElementById('mtGenStatus');
  var genBtn = document.getElementById('mtGenBtn');
  genBtn.disabled = true;
  genBtn.style.opacity = '0.5';
  statusEl.innerHTML = '<span style="color:var(--primary)">AI 正在生成会议纪要...</span>';

  var prompt = '你是一位专业的会议纪要撰写助手。请根据以下会议转录内容，生成一份结构化的会议纪要。\n\n' +
    '要求：\n' +
    '- 提取会议要点、关键决策、待办事项和责任人\n' +
    '- 语言专业、简洁、逻辑清晰\n' +
    '- 按以下结构组织：\n' +
    '  1. 会议概要（时间、地点、参会人、议题）\n' +
    '  2. 讨论要点（按议题分段，列出各方观点）\n' +
    '  3. 决议事项（明确决策结果）\n' +
    '  4. 待办事项（列出行动项、责任人和截止时间）\n' +
    '  5. 下次会议安排\n\n' +
    '会议信息：\n' +
    '- 标题：' + title + '\n' +
    '- 日期：' + date + (time ? ' ' + time : '') + '\n' +
    '- 地点：' + (location || '未指定') + '\n' +
    '- 参会人员：' + (participants || '未指定') + '\n' +
    '- 会议说明：' + (description || '无') + '\n\n' +
    '会议转录内容：\n' + transcript + '\n\n' +
    '请直接输出会议纪要内容，不要输出思考过程：';

  callAI(prompt,
    function(chunk, accumulated) {
      var display = cleanThinkingTags(accumulated);
      var minutesEl = document.getElementById('mtMinutes');
      if (minutesEl) minutesEl.value = display;
      statusEl.innerHTML = '<span style="color:var(--primary)">AI 生成中...</span>';
    },
    function(finalText) {
      var cleaned = cleanThinkingTags(finalText);
      document.getElementById('mtMinutes').value = cleaned;
      genBtn.disabled = false;
      genBtn.style.opacity = '1';
      statusEl.innerHTML = '<span style="color:var(--success)">生成完成</span>';
      toast('会议纪要已由 AI 生成，请检查并修改', 'success');
    },
    function(err) {
      genBtn.disabled = false;
      genBtn.style.opacity = '1';
      statusEl.innerHTML = '<span style="color:var(--danger)">生成失败：' + escapeHtml(err.message) + '</span>';
      toast('AI 生成失败，请检查 API 配置是否正确', 'error');
    }
  );
}

/* ---- Save Meeting ---- */
function saveMeeting(status) {
  var title = document.getElementById('mtTitle').value.trim();
  var date = document.getElementById('mtDate').value;
  var time = document.getElementById('mtTime').value.trim();
  var location = document.getElementById('mtLocation').value.trim();
  var participants = document.getElementById('mtParticipants').value.trim();
  var description = document.getElementById('mtDescription').value.trim();
  var transcript = document.getElementById('mtTranscript').value.trim();
  var minutes = document.getElementById('mtMinutes').value.trim();

  if (!title) { toast('请填写会议标题', 'error'); return; }

  var meetingObj = {
    id: editingMeetingId || 'mt_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
    title: title,
    date: date,
    time: time,
    location: location,
    participants: participants,
    description: description,
    transcript: transcript,
    minutes: minutes,
    hasAudio: !!(_meetingAudioFile || meetingRecordedChunks.length > 0),
    status: status || 'draft',
    updatedAt: new Date().toISOString()
  };

  if (editingMeetingId) {
    var idx = meetings.findIndex(function(m) { return m.id === editingMeetingId; });
    if (idx >= 0) {
      meetingObj.createdAt = meetings[idx].createdAt;
      meetings[idx] = meetingObj;
    }
  } else {
    meetingObj.createdAt = new Date().toISOString();
    meetings.push(meetingObj);
  }

  persistMeetings();
  closeModal();
  toast('会议纪要已保存', 'success');
  if (currentView === 'meetings') renderView('meetings');
  updateCounts();
}

function editMeeting(id) {
  closeModal();
  openMeetingEditor(id);
}

function deleteMeeting(id) {
  var m = getMeeting(id);
  if (!m) return;
  if (confirm('确定删除会议纪要"' + m.title + '"？此操作不可恢复。')) {
    meetings = meetings.filter(function(m) { return m.id !== id; });
    persistMeetings();
    closeModal();
    toast('会议纪要已删除', 'success');
    if (currentView === 'meetings') renderView('meetings');
    updateCounts();
  }
}

function copyMeetingText(id) {
  var m = getMeeting(id);
  if (!m) return;
  var text = '🎙 ' + m.title + '\n';
  text += (m.date || '') + (m.time ? ' ' + m.time : '') + '\n';
  if (m.location) text += '地点：' + m.location + '\n';
  if (m.participants) text += '参会：' + m.participants + '\n';
  text += '\n';
  if (m.description) text += '【会议说明】\n' + m.description + '\n\n';
  if (m.transcript) text += '【会议转录】\n' + m.transcript + '\n\n';
  if (m.minutes) text += '【会议纪要】\n' + m.minutes + '\n\n';
  text += '记录人：' + (settings.author || '');

  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() { toast('已复制到剪贴板', 'success'); });
  } else {
    fallbackCopy(text);
  }
}
